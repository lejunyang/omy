[workspace]
resolver = "3"
members = [
    "crates/omy-core",
    "crates/omy-config",
    "crates/omy-remote",
    "crates/omy-secret",
    "crates/omy-cli",
    "crates/omy-media",
    "crates/omy-net",
    "crates/omy-gui",
    # spike 是一次性的可行性验证程序，不是产品代码。
    # 放进 workspace 以复用依赖解析与 target 目录，但 publish = false。
    "spikes/webview-range",
    "spikes/lan-pairing",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
# edition 2024 自身只要求 1.85，但 grammers-mtsender 0.10 依赖的
# hickory-{net,proto,resolver} 0.26.3 明确要求 1.88；该链没有仍满足 grammers
# 版本约束的 1.85 兼容版本。resolver="3" 只能在存在兼容候选时降级，不能凭空
# 解开这个约束，所以 workspace 的真实 MSRV 是 1.88。
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lejunyang/omy"
authors = ["omy contributors"]

[workspace.dependencies]
# ---- 加密原语 ----
# 刻意固定在 RustCrypto 0.10 系列：该系列 API 稳定且经充分审计。
# 0.11 系列有破坏性变更（trait 重构、类型签名调整），升级需同步改代码并重跑全部
# 测试向量验证字节级一致性，不能只改版本号。
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
aes-gcm          = { version = "0.10", default-features = false, features = ["alloc", "aes", "getrandom"] }
argon2           = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
hkdf             = "0.12"
hmac             = "0.12"
sha2             = "0.10"
blake2           = "0.10"
zeroize          = { version = "1.8", features = ["derive"] }
subtle           = "2.6"

# ---- 压缩 ----
zstd = { version = "0.13", default-features = false }

# ---- 工具 ----
uuid       = { version = "1.11", default-features = false, features = ["v4"] }
crc32fast  = "1.4"
rand_core  = { version = "0.6", features = ["getrandom"] }
thiserror  = "2.0"

# ---- 测试 ----
hex        = "0.4"
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
proptest   = "1.5"

# ---- CLI（仅 omy-cli 使用；版本经镜像 sparse 索引核实，非凭记忆填写）----
clap          = { version = "4.6", features = ["derive", "wrap_help", "env"] }
clap_complete = "4.6"
anyhow        = "1.0"
# 从 /dev/tty 或 Windows 控制台读密码且不回显。命令行明文参数是旁路 L12，
# 交互式输入是默认且最推荐的通道。
rpassword     = "7.5"
walkdir       = "2.5"
# 系统 locale 检测，用于 D-29 的语言自动识别
sys-locale    = "0.3"
toml          = "1.1"
dirs          = "6.0"

# ---- 异步运行时（omy-net 与 omy-cli 共用）----
# 提到 workspace 统一版本：两处各自声明迟早会漂移，
# 而 tokio 的版本不一致会导致 runtime 类型不兼容这种难查的问题
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }

# ---- 媒体（仅 omy-media 使用）----
# 缩略图缩放与编码。默认关掉全部格式再按需开启：
# image 默认会拉进十几个解码器，每个都是解析不可信输入的攻击面。
# 版本经镜像 sparse 索引核实，非凭记忆填写。
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "ico"] }

# ---- 进度显示（仅 omy-cli 使用）----
# 大文件加解密是纯 CPU 循环，没有进度反馈时用户无法区分「在算」和「卡死」。
# 版本经 cargo search 核实；MIT 许可，rust-version 不高于本 workspace。
indicatif = "0.18"

# ---- 回收站（仅 omy-gui 使用）----
# 「移到回收站」必须调各平台的原生 API（Windows 的 IFileOperation、
# macOS 的 NSFileManager、Linux 的 freedesktop trash 规范），
# 自己实现等于重写三套平台代码且极易造成数据丢失。
# MIT 许可，与 omy-gui 的 GPL-3.0 兼容。
trash = "5.2"

# ---- Telegram（仅 omy-remote 使用）----
# 纯 Rust 的 MTProto 实现。选它而不是 TDLib 的核心理由是**没有 C 工具链**：
# 整条依赖树里没有 openssl / ring / bindgen / sqlite，Android 交叉编译已实测
# 通过。TDLib 正是因为 C++ 依赖在 Android 上的构建成本被否决的。
#
# 只取 client 与 session 两个 crate：mtsender / mtproto / tl-types 由 client
# 间接带入，直接声明反而会多出几处版本需要同步。
#
# proxy feature 不是可选项：本机实测直连 Telegram 数据中心
# （149.154.167.51:443）超时，经 socks5 代理约 3.3 秒完成握手。
# 没有它，在需要代理的网络环境下根本连不上。
grammers-client = { version = "0.10", features = ["proxy"] }

# **必须 default-features = false**，否则「没有 C 工具链」这条就不成立了。
#
# grammers-session 的默认 feature 里有 `sqlite-storage`，它会拉进 libsql，
# 而 libsql 的 build 依赖是 bindgen + cmake + cc——也就是一整套 C 工具链。
# 这正是 TDLib 被否决的那个理由，接进来等于白否决。实测确认：去掉默认
# feature 后依赖树里 bindgen / libsql / libsql-ffi 全部消失。
#
# 代价是没有现成的 sqlite session 存储，要自己序列化 session。这是**想要**
# 的：session 里有 auth key，本来就该由我们自己决定怎么落盘（放进已加密的
# 应用数据里），而不是让第三方库在用户目录下另开一个明文 sqlite。
#
# ⚠ 一个会反复咬人的坑：**grammers 官方的 examples 用的正是 SqliteSession**
# （见 grammers-client 的 examples/dialogs.rs）。照抄示例会把 libsql 连同
# 整套 C 工具链请回来，而且在装了 MSVC 的开发机上照样编译通过、只有别人的
# 机器或 Android 交叉编译才炸。要用内存或自建存储，不要照示例写。
# tests/no_c_toolchain.rs 就是为拦住这种回归而存在的。
#
# 开 `serde`（纯 Rust，只带 serde + serde_with，不碰 C 工具链）让 `DcOption`
# 可序列化，由我们自己加密后落盘，见 omy-remote 的 telegram/session.rs。
# 没有它就只能手抄一遍 DcOption 的字段——那是同一份结构的第二处定义，
# 上游加字段时我们这边会静默丢数据，而丢的可能正好是 auth key。
grammers-session = { version = "0.10", default-features = false, features = ["serde"] }

# 这两个本来由 grammers-client 间接带入，但我们有**必须**直接用到它们的地方，
# 所以显式声明（版本与 client 保持一致，不一致会解析出两份类型）：
#
# - `grammers-mtsender`：SenderPool / ConnectionParams / RpcError。扫码登录要
#   自己建连接池、要按 RpcError 的 name 区分 FLOOD_WAIT 与 API_ID_PUBLISHED_FLOOD。
# - `grammers-crypto`：只用 `check_p_and_g` 一个函数，用来在调
#   `Client::check_password` **之前**验掉 2FA 参数。grammers 内部在参数不合法时
#   是 `panic!`，而 omy-gui 禁止 panic、release 下 `panic = "abort"` 连
#   catch_unwind 都救不了——只能不让它有机会被撞到。
grammers-mtsender = "0.10"
grammers-crypto = "0.10"

# 把登录令牌画成二维码。
#
# **必须 default-features = false**：默认 feature 里的 `image` 会拉进一整套
# 图像编解码器，而我们只要那个 21x21 的模块矩阵——界面自己用 div 画格子
# （原型 telegram-remote-prototype.html 就是这么画的）。生成 PNG 再塞进
# WebView 反而多一次编码和一次 base64。
#
# MIT OR Apache-2.0，与本仓库的分层许可兼容。
qrcode = { version = "0.14", default-features = false }

# 钉死这个 rc 版本，**不要改成 "2.0.0-rc0" 或放宽成 ^**。
#
# 为什么：grammers 0.10 依赖链里声明的是 `glass_pumpkin = "^2.0.0-rc0"`，
# 而上游发的 rc1 改了 `safe_prime::check` 的签名。按 semver，^2.0.0-rc0 会
# 解析到 rc1，于是 grammers 编译不过——这不是我们的代码的问题，也不是
# 改自己代码能解决的。已实测：钉 =2.0.0-rc0 后 cargo check 通过。
#
# 这是一条只为「让上游能编译」而存在的声明，我们自己一行都不用它。
# 将来 grammers 放宽或修正那个约束后，这两行应当一起删掉。
glass_pumpkin = "=2.0.0-rc0"

# 发布配置：优化加解密吞吐
[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"
strip         = true

# 测试用发布配置：保留断言但有优化，跑属性测试更快
[profile.test]
opt-level = 1

# 依赖始终带优化编译，避免 debug 模式下 Argon2 慢到无法接受
[profile.dev.package."*"]
opt-level = 3
