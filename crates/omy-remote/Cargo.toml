[package]
name = "omy-remote"
description = "omy 远程位置：统一的 RemoteStore 抽象与 WebDAV 驱动。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
# 与 gui/cli 同为 GPL：它依赖 HTTP 栈且直接服务于应用，
# 不像 omy-core 那样定位为可被任意集成的格式库。
license = "GPL-3.0-or-later"
publish = false

[dependencies]
omy-core = { path = "../omy-core" }
omy-config = { path = "../omy-config" }

# rustls 而非 native-tls：后者会拖进 OpenSSL，交叉编译到 Android 会失败。
# 注意 0.13 把这个 feature 从 `rustls-tls` 改名为 `rustls`（旧名在 0.12 及以前），
# 且需要 webpki-roots 提供根证书——不带的话所有 HTTPS 握手都失败。
# 版本与 feature 名经 rsproxy sparse 索引核实，非凭记忆填写。
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "webpki-roots",
    "stream",
    "charset",
    "http2",
] }
# WebDAV 动词（PROPFIND / MKCOL / MOVE）。与 reqwest 同源，不额外拖一套 HTTP 栈。
reqwest_dav = "0.3"
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
# 位置密钥槽的 PDK 用 Zeroizing 包裹，用完即擦
zeroize = { workspace = true }
# 缓存键用 blake2，与 core 同源
blake2 = { workspace = true }
# 百分号编码：WebDAV 路径里的中文与空格必须编码，否则部分服务端 400
percent-encoding = "2.3"
# 添加位置时就校验地址，而不是等第一次浏览才报错
url = "2.5"
# Telegram 重新上传普通文件时沿用 grammers 的 MIME 推断规则；虽然 client 已
# 间接依赖它，但产品代码直接调用就必须显式声明，避免依赖树变化后失效。
mime_guess = "2.0"

# Telegram 驱动。版本与「为什么钉 glass_pumpkin」写在根 Cargo.toml，
# 这里只引用 workspace 声明——两处各自写版本迟早漂移。
grammers-client = { workspace = true }
grammers-session = { workspace = true }
grammers-mtsender = { workspace = true }
grammers-crypto = { workspace = true }
# tdata 导入要用的原语。
#
# 这几个**本来就已经在依赖树里**（grammers-crypto 的传递依赖，Cargo.lock 里
# 能查到 sha1 0.10 / md-5 0.10 / pbkdf2 0.13），所以不增加编译体积、不拉新的
# C 工具链、no_c_toolchain 守卫不受影响。但传递依赖不能直接 use，
# 要用必须显式声明——这和「一行都不用改」不是一回事。
#
# AES-IGE 不在这里：grammers-crypto 已经公开了 aes::ige_decrypt，直接用它。
md-5 = "0.10"
sha1 = "0.10"
pbkdf2 = { version = "0.12", default-features = false }
# PBKDF2-SHA512 要的 HMAC 与 SHA-512。两者同样早就在依赖树里
# （workspace 已统一声明版本，这里只引用）。
hmac = { workspace = true }
sha2 = { workspace = true }
# 登录令牌要画成二维码；只取模块矩阵，不要它的图像编码
qrcode = { workspace = true }
# WebDAV 密码信封在配置里是 toml::Value（见 placebook），CLI 与 GUI 共用
toml = { workspace = true }
# Telegram 的 auth key 等同账号凭据（拿到它不用密码也不用验证码就能发请求），
# 落盘前必须加密——与 WebDAV 密码走同一条路，见 telegram/session.rs。
omy-secret = { path = "../omy-secret" }
# 登录态存档是 JSON（信封 + 内层结构），产品路径就要用，不是只有测试用
serde_json = { workspace = true }
# 见根 Cargo.toml：这一条只为让 grammers 的依赖链能编译，我们自己不用它。
# 必须真的出现在某个 crate 的依赖里，否则 workspace 声明不会参与版本解析。
glass_pumpkin = { workspace = true }

[dev-dependencies]
dav-server = "0.11.0"
http = "1.5.0"
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "time", "io-util"] }
# 只给测试用：验证内嵌缩略图**真的能被解码器接受**。
#
# 光验魔数（FF D8 FF）不够——Telegram 的 stripped 缩略图去掉了标准量化表，
# 一段只补了头两个字节的残缺 JPEG 照样能通过魔数检查，却永远解不开，
# 而界面上只是图不出来、不报任何错。这个依赖让那条断言能停在
# 「真的能解码」而不是「看起来像 JPEG」。
image = { workspace = true }
