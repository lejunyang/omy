[package]
name = "omy-cli"
description = "omy 命令行工具：加解密、扫描、分片、密钥管理。与 GUI 共享 omy-core，行为一致。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
# CLI 是 GPL-3.0（决策 D-25 的分层许可策略）：
# core/net 用 MIT OR Apache-2.0 保持可复用，cli/gui 用 GPL-3.0 保障用户自由。
license = "GPL-3.0-or-later"

[[bin]]
name = "omy"
path = "src/main.rs"

[dependencies]
# path 与 version 都要写：本地构建用 path，发布到 crates.io 时 cargo 去掉
# path 只留 version。缺 version 时 `cargo package` 会直接失败。
omy-core = { path = "../omy-core", version = "0.0.1" }
# 配置定义与读写，与 GUI 共用同一份，避免两边默认值漂移
omy-config = { path = "../omy-config", version = "0.0.1" }
# LGPL-2.1+ 依赖。GPL-3.0 兼容 LGPL-2.1+（后者可升级为 GPL-3.0），
# 故这个方向的依赖是允许的；反向（core 依赖 media）则会让 MIT 的 core
# 被 LGPL 传染，绝不可以。
omy-media = { path = "../omy-media", version = "0.0.1" }
# 局域网共享。omy-net 是 MIT OR Apache-2.0，被 GPL-3.0 的 CLI 依赖，
# 方向正确（宽松许可可被 GPL 吸收，反过来不行）
omy-net = { path = "../omy-net", version = "0.0.1" }
# 设备密钥：把一把 KEK 封进 TPM，由 Windows Hello 把守。
# CLI 也要能管理它——否则「用 GUI 加的设备密钥，命令行看不见」，
# 而 key list 恰恰是排查密码问题时最常用的入口
omy-secret = { path = "../omy-secret", version = "0.0.1" }
tokio.workspace = true
clap.workspace = true
clap_complete.workspace = true
anyhow.workspace = true
rpassword.workspace = true
walkdir.workspace = true
sys-locale.workspace = true
toml.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
# 加解密进度条。大文件是纯 CPU 循环，没有反馈时用户分不清「在算」和「卡死」。
indicatif.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# CLI 处理不可信输入（文件、参数、配置），同样不允许 panic 类模式。
# 但 CLI 允许 integer_division 与算术：它大量做人类可读的单位换算，
# 且这些计算不参与密钥派生或偏移寻址。
[lints.clippy]
indexing_slicing        = "warn"
unwrap_used             = "warn"
panic                   = "warn"
arithmetic_side_effects = "allow"
integer_division        = "allow"
cast_possible_truncation = "warn"
cast_sign_loss          = "warn"
expect_used             = "allow"
missing_panics_doc      = "allow"

[target.'cfg(not(target_os = "android"))'.dependencies]
# --original trash：与 GUI 用同一个 crate，保证两个入口的回收站行为一致。
#
# 按平台声明（与 omy-gui 一致）：trash 5.2 的 cfg 明确排除了 android，
# 那里这个 crate 不提供任何函数。无条件依赖会在**编译 trash 自身**时就报
# 「cannot find module or crate `platform`」，而报错指向 registry 里的
# 第三方源码，看不出是我们的依赖声明写错了。
trash = { workspace = true }
