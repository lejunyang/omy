<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="1024" height="1024">
  <!-- omy 品牌标：一把锁，锁体上是播放键——「加密之后依然能直接播放」。
       这是应用图标的源文件；改动后用 `cargo tauri icon icons/logo.png`
       重新生成各平台图标（logo.png 由本文件按 1024px 渲染而来）。 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4493f8"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#g)"/>
  <path d="M22.5 29v-5.5a9.5 9.5 0 0 1 19 0V29" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <rect x="15" y="27" width="34" height="26" rx="8" fill="#fff"/>
  <path d="M29 33.6 39.4 40 29 46.4Z" fill="#1f6feb" stroke="#1f6feb" stroke-width="2" stroke-linejoin="round"/>
</svg>
