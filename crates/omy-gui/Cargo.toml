[package]
name = "omy-gui"
description = "omy 图形界面：Tauri v2 + WebView，加密文件浏览、预览与播放。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
# GUI 与 CLI 同为 GPL-3.0（决策 D-25 的分层许可策略）：
# core/net 用 MIT OR Apache-2.0 保持可复用，cli/gui 用 GPL-3.0 保障用户自由。
# 依赖 LGPL 的 omy-media 在这个方向上是允许的。
license = "GPL-3.0-or-later"
# 不发布到 crates.io。
#
# build.rs 在前端产物缺失时会去跑 pnpm，而 dist/ 不入库（见 .gitignore 的说明），
# 所以 crates.io 上的 .crate 包里没有可用界面：使用者 `cargo install omy-gui`
# 时若机器上没有 Node 工具链，构建会在 build.rs 里失败。
# GUI 的正确分发渠道是 Release 里的安装包与 APK，不是 registry。
publish = false

[[bin]]
name = "omy-gui"
path = "src/main.rs"

# 移动端（Android/iOS）通过 JNI/FFI 加载 cdylib 库，而不是执行
# 独立二进制：Tauri 的 MainActivity 会 dlopen 这个库再调入口。
# rlib 供桌面 bin 与测试复用，staticlib/cdylib 供移动端链接。
[lib]
name = "omy_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
omy-core = { path = "../omy-core" }
# 配置读写：与 CLI 共用同一份定义与默认值，避免两边默认值漂移
omy-config = { path = "../omy-config" }
# 远程位置：RemoteStore 抽象与 WebDAV 驱动
omy-remote = { path = "../omy-remote" }
omy-secret = { path = "../omy-secret" }
# 远程位置的凭据信封以 toml::Value 形式存进配置，不透明转发
toml = { workspace = true }
omy-media = { path = "../omy-media" }
# 局域网共享：设备发现、配对、零密钥服务端
omy-net = { path = "../omy-net" }
# 不启用 protocol-asset：所有内容都走自定义的 omystream:// 协议。
# asset 协议会直接暴露文件系统路径，与「明文不落盘」的目标相悖。
#
# custom-protocol 必须开：它决定前端资源是「从二进制里读」还是
# 「向 dev server 发 HTTP 请求取」（tauri 的 build.rs 里 dev = !custom-protocol）。
# 不开时移动端会去代理一个并不存在的 dev server，整个页面加载失败，
# 报 "error sending request for url (http://tauri.localhost/)" 后白屏。
# 桌面端看不出问题——那条代理分支是 cfg(all(dev, mobile))，只在移动端生效。
tauri = { version = "2", features = ["custom-protocol"] }
# 原生目录选择器。只在 Rust 侧调用并封装成自己的命令，
# 因此 capabilities 里**不开放** dialog 权限给前端——
# 前端拿不到任意路径选择能力，只能走我们受控的入口。
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
sys-locale.workspace = true
dirs.workspace = true
# 配对与共享要在后台等待，需要异步运行时。
# 版本必须与 omy-net 一致，否则 runtime 类型不兼容
tokio = { workspace = true }
# 设备库密码留在会话里以免反复询问，Drop 时必须抹掉
zeroize = { workspace = true }
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# GUI 直接面对用户的任意文件与任意操作，同样不允许 panic 类模式。
# 允许算术与整数除法：大量做像素、进度、字节数的换算，
# 且这些计算不参与密钥派生或偏移寻址。
[lints.clippy]
indexing_slicing        = "warn"
unwrap_used             = "warn"
panic                   = "warn"
expect_used             = "warn"
todo                    = "warn"
unimplemented           = "warn"

[target.'cfg(not(target_os = "android"))'.dependencies]
# 「移到回收站」：原生回收站 API 的跨平台封装。
# 不能用 remove_file 冒充——用户选「回收站」是想要能后悔，
# 悄悄改成永久删除就是数据丢失。
#
# 按平台声明：trash 5.2 的 cfg 明确排除了 android，在 Android 上
# 这个 crate 不提供任何函数，无条件依赖会在链接期才报错。
trash = { workspace = true }
