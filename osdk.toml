[tools]
java = "21"
android-ndk = "29"
rust = { version = "1.98", targets = "aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android,x86_64-apple-darwin" }
android-platform-tools = "37"
android-emulator = { version = "37", accept-license = "android-sdk-preview-license" }
android-build-tools = "37"
android-cmdline-tools = "latest"
android-system-images = "android-35;google_apis;x86_64"
# FFmpeg 裁剪构建的工具链（见 docs/research/13-ffmpeg-minimal-build.md）。
# Windows 上不需要装 MSYS2：mingw 交叉编译器与 POSIX 构建环境都由 conda 提供。
#
# 平台边界：除 nasm 外，下列 conda 包都用 when 限定为 Windows 专用。
# Linux 原生构建直接用系统已有的 gcc / make / cmake / pkg-config，不需要这些
# 包 —— 若在 Linux 也安装，m2-base 的 expose shim 会用 MSYS2 版的
# bash/sed/make 盖住系统同名命令（且它们是 Windows exe，在 Linux 根本跑不了），
# gcc_win-64 这类交叉编译器则毫无用处。nasm 是唯一系统通常不自带、而两个平台
# 都需要的工具（x86 SIMD 汇编），所以 Windows 与 Linux 都装它。
"conda:gcc_win-64" = { version = "16", when = { os = ["windows"] } }  # mingw-w64 交叉编译器 + binutils
"conda:nasm" = { version = "2.16", when = { os = ["windows", "linux"] } }  # x86 SIMD 汇编
"conda:cmake" = { version = "4", when = { os = ["windows"] } }  # 编 libwebp 用
"conda:ninja" = { version = "1", when = { os = ["windows"] } }
#
# POSIX 环境刻意只 pin m2-base 一个包、其余用 `with` 装进同一 prefix，
# 而不是每个 m2-* 各 pin 一行。原因不是少写几行：
#
# conda 的每个 tool 各占一个独立 prefix，而每个 m2-* 包都自带一份
# msys-2.0.dll。Windows 按「路径」而非内容实例化 DLL，所以 8 个单包在同一
# 进程树里就是 8 套互不相识的 msys 运行时 —— 每个 sh.exe 按自己 DLL 的位置
# 推导 POSIX 根，于是 m2-bash 的 sh 眼中 /usr/bin 只有它自己的文件，
# FFmpeg 的 configure 里 tr / head / awk 全部 command not found；
# 同时 6 个包都提供 bash，shim 因归属不唯一而拒绝路由 bash。
#
# `with` 让主包与附加包一次联合求解、装进同一个 prefix：msys-2.0.dll 只有
# 一份，工具彼此可见（实测 8 份 -> 1 份，bash 歧义随之消失）。
# 参见 one-sdk 的 docs/bugs/005（根因 B）与 docs/conda-with-option-spec.zh-CN.md。
#
# m2-base 是元包，自带 sh/bash/coreutils/grep/sed/gawk/findutils，但不含
# make 与 pkg-config，两者必须由 with 补上。
#
# 本段由 `osdk use conda:m2-base@2022.6.1 --opt with=m2-make,m2-diffutils,m2-pkg-config`
# 生成，改动请用 osdk 命令而非手工编辑（`with` 参与安装 identity，
# 手改会指向另一个 prefix）。
"conda:m2-base" = { version = "2022", with = "m2-make,m2-diffutils,m2-pkg-config", when = { os = ["windows"] } }
node = "22"
pnpm = "9"
android-platforms = "=android-36"

[settings.shims.tools."conda:m2-base"]
expose = ["make", "sh", "bash", "sed", "grep", "awk", "gawk", "tr", "head", "tail", "cut", "sort", "uniq", "mkdir", "rm", "cp", "mv", "dirname", "basename", "expr", "find", "diff", "cmp", "pkg-config", "printf", "cat", "wc", "ln", "date", "tee", "tar", "bsdtar", "gzip", "gunzip", "sha256sum", "curl", "nproc", "stat"]

[settings.shims.tools."conda:gcc_win-64"]
expose = ["x86_64-w64-mingw32-gcc", "x86_64-w64-mingw32-g++", "x86_64-w64-mingw32-ar", "x86_64-w64-mingw32-as", "x86_64-w64-mingw32-nm", "x86_64-w64-mingw32-ranlib", "x86_64-w64-mingw32-strip", "x86_64-w64-mingw32-objdump", "x86_64-w64-mingw32-windres", "x86_64-w64-mingw32-ld", "x86_64-w64-mingw32-dlltool"]

# Linux 宿主系统开发包。osdk 只负责声明与检查（osdk pkg status / plan），
# 安装由 osdk pkg apply 打印命令、用宿主包管理器执行，osdk 自己不提权。
#
# 清单依据两条线索核对过：Tauri 2 官方 Linux 前置包（与 .github/workflows 里
# apt-get 装的完全一致），以及 `cargo tree` 里实际出现的全部 *-sys crate：
# webkit2gtk/gtk/soup/atk/pango 等 -sys 由 Tauri/tao 带入，libdbus-sys 由
# omy-secret 的 keyring（Secret Service）带入。
#
# nasm 不在此列：它由上方 osdk conda 提供，不重复声明。
[syspkg.packages]
# ---- 基础构建环境：FFmpeg 构建与各 -sys crate 编译 C 代码都依赖 ----
"apt:build-essential" = { version = "latest", os = ["linux"] }  # gcc/g++/make/libc-dev
"apt:pkg-config" = { version = "latest", os = ["linux"] }       # -sys crate 的 build script 查库
"apt:cmake" = { version = "latest", os = ["linux"] }            # 编 zlib/libwebp；aws-lc-sys 也需要
"apt:perl" = { version = "latest", os = ["linux"] }             # aws-lc-sys（rustls）构建脚本需要
"apt:curl" = { version = "latest", os = ["linux"] }             # 下载 FFmpeg 等源码
"apt:wget" = { version = "latest", os = ["linux"] }             # Tauri 构建需要
"apt:file" = { version = "latest", os = ["linux"] }             # Tauri 构建需要
# ---- omy-secret：keyring 的 Secret Service 后端 ----
"apt:libdbus-1-dev" = { version = "latest", os = ["linux"] }
# ---- omy-gui：Tauri 2 前置包 ----
"apt:libwebkit2gtk-4.1-dev" = { version = "latest", os = ["linux"] }  # WebView（会带入 libgtk-3-dev）
"apt:libxdo-dev" = { version = "latest", os = ["linux"] }             # tao 全局快捷键
"apt:libssl-dev" = { version = "latest", os = ["linux"] }             # native-tls
"apt:libayatana-appindicator3-dev" = { version = "latest", os = ["linux"] }  # 系统托盘
"apt:librsvg2-dev" = { version = "latest", os = ["linux"] }           # SVG 加载

[tasks.android-avd-prepare]
run = 'pwsh -File spikes\android-external-edit-e2e\prepare-avd.ps1'
description = "检查 Android 工具链与 system image，缺失时创建 omy-test-35 AVD"

[tasks.android-emulator-start]
run = 'pwsh -File spikes\android-external-edit-e2e\start-emulator.ps1'
description = "启动或复用 omy-test-35，并等待模拟器完成启动"
depends = ["android-avd-prepare"]

[tasks.android-build]
run = 'pwsh -File spikes\android-external-edit-e2e\build-android.ps1'
description = "执行前端检查与生产构建，再构建 Android debug APK"

[tasks.android-release-build]
dir = "crates/omy-gui"
# 四个 Android ABI 的 rust target 不在这里 rustup target add：
# 单一来源是上方 [tools].rust.targets，由 osdk install rust 装工具链时
# 用 `rustup toolchain install --target ...` 一并装好（见发布流水线 build-android）。
run = [
  { argv = ["pnpm", "--dir", "frontend", "install", "--frozen-lockfile"] },
  { argv = ["pnpm", "--dir", "frontend", "build"] },
  { argv = ["cargo", "install", "tauri-cli", "--version", "^2", "--locked"] },
  { argv = ["cargo", "tauri", "android", "build", "--apk"] },
]
description = "构建前端并生成包含四个 ABI 的 Android release APK"
timeout = "60m"

[tasks.android-external-edit-e2e]
run = 'pwsh -File spikes\android-external-edit-e2e\run-e2e.ps1 -SkipBuild'
description = "在真实模拟器验证 WebDAV 只读/编辑、稳定 URI、同步与进程恢复"
depends = ["android-emulator-start", "android-build"]
