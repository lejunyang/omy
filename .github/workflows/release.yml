# 发布流水线。
#
# # 单一触发：提交标题含 [publish]
#
# 推送到 main 时，只看**本次推送最后一个提交**的标题（提交信息首行），
# 含 `[publish]` 才触发一次完整发布；也可在 Actions 页面手动触发。
# 不接受推 v* 标签触发：标签由本流水线在发布时创建，避免「打标签」和
# 「写 [publish]」两套入口各自只做一半动作。
#
# 只看最后一个提交（而不是遍历本次推送的每个提交）：发布意图应当由推送
# 链的顶端明确表达，而不是从一串中间提交里翻出来；这样旧提交里残留的
# 标记、或 rebase 进来的历史标记不会意外触发发布。
#
# 一次触发按顺序做两件事：
#
# 1. 构建 Windows / Linux / macOS（Apple Silicon + Intel）/ Android 全部产物，
#    全绿后创建 GitHub Release（自动打 v{version} 标签并挂产物）；
# 2. 发布到 crates.io（omy-core → omy-config → omy-media → omy-net →
#    omy-secret → omy-cli，omy-gui / omy-remote / spikes 不发布）。
#
# 两者共享同一组构建门禁：任何一个平台构建失败，Release 与 crates.io 都不会动。
#
# # 为什么 crates.io 仍单独走 environment
#
# GitHub Release 删了可以重发，而 **crates.io 的版本一经发布就无法删除**
# （只能 yank，版本号不能复用）。所以 publish 任务绑定 `crates-io`
# environment：CARGO_REGISTRY_TOKEN 配在里面，并可加 required reviewers，
# 让上传前停下来等人确认。触发标记只决定「流水线跑不跑」，environment
# 闸门决定「包发不发得出去」。
#
# # 平台策略
#
# 四个构建任务全部是硬门禁（不再有 continue-on-error）：既然要发布三系统
# 桌面目标与 APK，哪个平台编不过就不该出 Release，否则用户下载到的就是
# 缺平台的版本。但「CI 构建通过」不等于「真机实测通过」——目前只有
# Windows 与 Android 真正用过，Linux 与 macOS 仅保证编译与打包成功，
# 这一点会写进 Release 说明，不把两者混为一谈。
#
# # 内置 FFmpeg
#
# Windows 产物内置自建的裁剪 FFmpeg（含 H.264/HEVC），见 scripts/ffmpeg-build/。
# 其余平台暂不内置——构建链只在 Windows 上实测过，没实测过的内置二进制
# 比不内置更糟，这些平台沿用系统 FFmpeg 或 OMY_FFMPEG 指定的路径。

name: 发布

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 发布是不可撤销（crates.io）或对外可见（Release）的动作，绝不为新推送
# 取消正在跑的旧发布
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ---- 先判断这次要不要发布 ----

  decide:
    name: 判定发布标记
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.d.outputs.publish }}
      version: ${{ steps.d.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: 判定
        id: d
        run: |
          publish=false

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # 手动触发即视为明确发布意图
            publish=true
          else
            # 只取本次推送**最后一个**提交的标题（message 的首行）。
            #
            # 不遍历全部提交：发布意图必须由推送链顶端的那个提交明确表达，
            # 不从一串中间提交里翻标记，避免历史/rebase 残留的 [publish]
            # 意外触发。
            #
            # 不把提交信息插值进 shell（反引号 / $() 会变成命令注入）：
            # jq 直接读 GITHUB_EVENT_PATH 这个 JSON 文件。
            #
            # 只看标题（首行）：正文里讨论「[publish] 怎么用」曾误触发过
            # 发布，而这是发出去删不掉的动作。
            # 空提交列表（极端情况，如删除 ref 的 push 事件）last 为 null，
            # 直接 .message|split 会让 jq 报错使整个判定失败，故先判长度。
            subject=$(jq -r '
              if (.commits | length) > 0
              then (.commits | last | .message | split("\n")[0])
              else "" end' "$GITHUB_EVENT_PATH")
            case "$subject" in
              *'[publish]'*) publish=true ;;
            esac
          fi

          # workspace 版本在根 Cargo.toml 的 [workspace.package]，
          # 该段里第一个独立的 version = "..." 即工作区统一版本
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)

          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "发布         = $publish"
          echo "版本         = $version"

  # ---- 构建产物：四个任务全部是发布门禁 ----

  build-windows:
    name: 构建 Windows（已实测平台）
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust
        run: rustup toolchain install stable --profile minimal

      # omy-gui 的 build.rs 需要 pnpm，否则前端构建那步直接 panic。版本固定的理由见 test.yml 的 windows 任务
      - uses: actions/setup-node@v6.0.0
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 9.15.1

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: release-windows

      # ---- 内置 FFmpeg ----
      #
      # 装 osdk 而不是 MSYS2：本地开发用的就是根目录 osdk.toml 那套工具链，
      # CI 复用同一份配置才能保证「CI 里构建出来的 = 本地验证过的」。
      # 换成 MSYS2 等于维护第二套版本组合，而两套之间的漂移只会在产物里暴露。
      - name: 安装 osdk
        shell: pwsh
        run: |
          # -NoModifyShell：CI 不需要改 shell 启动文件，装完把 bin 加进 PATH 即可。
          # -InstallDir 显式指定：默认值是 LocalAppData 下的路径，写死在这里
          # 会与安装脚本的默认值形成两个真相，改了那边这里就悄悄失效
          $bin = Join-Path $env:RUNNER_TEMP 'osdk-bin'
          Invoke-WebRequest `
            https://raw.githubusercontent.com/lejunyang/one-sdk/main/install.ps1 `
            -OutFile install-osdk.ps1
          ./install-osdk.ps1 -NoModifyShell -InstallDir $bin
          if (-not (Test-Path (Join-Path $bin 'osdk.exe'))) {
            throw "osdk 未装到 $bin"
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: 信任 osdk.toml 并装工具链
        shell: pwsh
        run: |
          # osdk.toml 含 conda: 工具，属于 trust-required。未信任时该目录下
          # **所有** osdk 命令都会失败，且报错不提「没信任」这件事
          osdk --yes trust osdk.toml
          osdk -y install

      - name: 构建内置 FFmpeg
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'dist-ffmpeg'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          # sysroot 要转成 bash 能懂的 POSIX 路径：E:\x -> /E/x
          $gcc = (osdk -q where conda:gcc_win-64).Trim() -split "`r?`n" | Select-Object -First 1
          $posix = ($gcc -replace '\\', '/') -replace '^([A-Za-z]):', '/$1'
          $env:SYSROOT = $posix + '/Library/x86_64-w64-mingw32/sysroot'
          # OMY_FF_OUT 直接指向打包目录，省掉一次拷贝
          $env:OMY_FF_OUT = ($out -replace '\\', '/') -replace '^([A-Za-z]):', '/$1'
          bash scripts/ffmpeg-build/build-windows.sh
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg 构建失败（退出码 $LASTEXITCODE）" }

      - name: 校验 FFmpeg 产物
        shell: pwsh
        # 这是打包前的门禁，不是可选检查。configure 接受了参数却没启用组件时
        # **不报错**——configure 退出 0、make 退出 0，只有逐项复查才发现。
        # 发出去之后才暴露的话，用户装上就是「有的视频没缩略图」
        run: |
          $out = ((Join-Path $PWD 'dist-ffmpeg') -replace '\\', '/') -replace '^([A-Za-z]):', '/$1'
          bash scripts/ffmpeg-build/verify.sh $out
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg 产物校验未通过（退出码 $LASTEXITCODE）" }

      - name: 构建 CLI
        run: cargo build --release -p omy-cli

      - name: 构建 GUI
        # GUI 的 build.rs 会自动构建前端，所以这里不需要单独跑前端命令；
        # 但**必须**已经装好 Node 与 pnpm，见上面的说明
        run: cargo build --release -p omy-gui

      - name: 打包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target\release\omy.exe dist\
          Copy-Item target\release\omy-gui.exe dist\
          Copy-Item README.md dist\
          # FFmpeg 放 dist\ffmpeg\：omy-media 的 candidate_dirs() 会找
          # 「自身目录\ffmpeg」，所以解压即用，不需要用户配环境变量。
          # 放在子目录而不是与 omy.exe 平铺，是为了让用户一眼看出哪些文件
          # 是 FFmpeg 的，替换时不会误删
          New-Item -ItemType Directory -Path dist\ffmpeg -Force | Out-Null
          Copy-Item dist-ffmpeg\* dist\ffmpeg\ -Recurse
          Compress-Archive -Path dist\* `
            -DestinationPath omy-${{ needs.decide.outputs.version }}-x86_64-pc-windows-msvc.zip

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: windows
          path: '*.zip'

  build-android:
    name: 构建 Android APK（已实测平台）
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust 与 Android 目标
        run: |
          rustup toolchain install stable --profile minimal
          # APK 默认打四个 ABI（gen/android/buildSrc 里的 targetList），
          # 只装前两个时 gradle 会在编 x86 那一档才报错，而前面几档已经编了很久
          rustup target add aarch64-linux-android armv7-linux-androideabi \
            i686-linux-android x86_64-linux-android

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          # 与 osdk.toml 固定的 java 版本一致，理由见 test.yml 里的说明
          java-version: '21'

      - uses: android-actions/setup-android@v4.0.1

      - name: 安装 NDK
        env:
          NDK_VERSION: '29.0.14206865'
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: 指定交叉编译用的 C 编译器与链接器
        # cc-rs 找的是不带 API 级别的名字，而 NDK 只提供带级别的 wrapper，
        # 不指定的话 zstd-sys 会报「failed to find tool」。
        # 完整理由见 test.yml 里的同名步骤。
        #
        # 这里要配齐四个 ABI，与上面 rustup target add 的四个目标对应。
        #
        # LINKER 也一并设上。APK 走 gradle 调 NDK 链接 .so，目前这条路径不依赖
        # 它，所以这里是**预防性**的：一旦将来在这个任务里直接 cargo build 出
        # 可执行文件，缺它就会挂在 `error: linker `cc` not found`。
        env:
          API_LEVEL: '24'
        run: |
          BIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$BIN/aarch64-linux-android${API_LEVEL}-clang" || {
            echo "NDK 里没有 aarch64-linux-android${API_LEVEL}-clang，NDK 目录可能不完整"
            ls "$BIN" | head -50
            exit 1
          }
          {
            echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android${API_LEVEL}-clang"
            echo "CC_armv7_linux_androideabi=$BIN/armv7a-linux-androideabi${API_LEVEL}-clang"
            echo "CC_i686_linux_android=$BIN/i686-linux-android${API_LEVEL}-clang"
            echo "CC_x86_64_linux_android=$BIN/x86_64-linux-android${API_LEVEL}-clang"
            echo "AR_aarch64_linux_android=$BIN/llvm-ar"
            echo "AR_armv7_linux_androideabi=$BIN/llvm-ar"
            echo "AR_i686_linux_android=$BIN/llvm-ar"
            echo "AR_x86_64_linux_android=$BIN/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android${API_LEVEL}-clang"
            echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$BIN/armv7a-linux-androideabi${API_LEVEL}-clang"
            echo "CARGO_TARGET_I686_LINUX_ANDROID_LINKER=$BIN/i686-linux-android${API_LEVEL}-clang"
            echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$BIN/x86_64-linux-android${API_LEVEL}-clang"
          } >> "$GITHUB_ENV"

      # 这里装 bun 是不够的：build.rs 按 frontend/ 下的 lockfile 选包管理器，
      # 看到 pnpm-lock.yaml 就只调 pnpm，不会退回 bun 或 npm
      - uses: actions/setup-node@v6.0.0
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 9.15.1

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: release-android

      - name: 安装 tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: 构建 APK
        working-directory: crates/omy-gui
        # 产出的是未签名 APK：签名密钥不能进仓库，也不该由 CI 代持。
        # 需要正式签名版时由维护者本地签，或另配 secrets 后在此加签名步骤。
        run: cargo tauri android build --apk

      - name: 收集 APK
        run: |
          mkdir -p out
          find . -name '*.apk' -path '*release*' -exec cp {} out/ \;
          ls -la out/

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: android
          path: out/*.apk

  build-linux:
    name: 构建 Linux x86_64（构建门禁，尚未真机实测）
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装系统依赖
        # Tauri v2 需要 WebKitGTK 4.1，omy-gui 缺了会在链接期报错
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: 安装 Rust
        run: rustup toolchain install stable --profile minimal

      # omy-gui 的 build.rs 需要 pnpm，理由见 build-windows
      - uses: actions/setup-node@v6.0.0
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 9.15.1

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: release-linux

      - name: 构建
        run: |
          cargo build --release -p omy-cli -p omy-gui

      - name: 打包
        run: |
          mkdir -p dist
          cp target/release/omy target/release/omy-gui README.md dist/
          tar -czf omy-${{ needs.decide.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz -C dist .

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: linux
          path: '*.tar.gz'

  build-macos:
    name: 构建 macOS（构建门禁，尚未真机实测）
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust
        run: rustup toolchain install stable --profile minimal

      # 同时出 Apple Silicon 与 Intel 两份：macos-latest 是 arm64 机器，
      # x86_64 靠交叉编译。GitHub runner 的系统框架（WebKit 等）是
      # universal 的，rustup 加个 target 即可链接，不需要额外 SDK。
      - name: 添加 Intel 目标
        run: rustup target add x86_64-apple-darwin

      # omy-gui 的 build.rs 需要 pnpm，理由见 build-windows
      - uses: actions/setup-node@v6.0.0
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 9.15.1

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: release-macos

      - name: 构建 Apple Silicon
        run: cargo build --release -p omy-cli -p omy-gui --target aarch64-apple-darwin

      - name: 构建 Intel（交叉编译）
        run: cargo build --release -p omy-cli -p omy-gui --target x86_64-apple-darwin

      - name: 打包
        run: |
          version='${{ needs.decide.outputs.version }}'
          mkdir -p dist-arm dist-x86
          cp target/aarch64-apple-darwin/release/omy \
             target/aarch64-apple-darwin/release/omy-gui README.md dist-arm/
          cp target/x86_64-apple-darwin/release/omy \
             target/x86_64-apple-darwin/release/omy-gui README.md dist-x86/
          tar -czf "omy-${version}-aarch64-apple-darwin.tar.gz" -C dist-arm .
          tar -czf "omy-${version}-x86_64-apple-darwin.tar.gz" -C dist-x86 .

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: macos
          path: '*.tar.gz'

  # ---- 创建 GitHub Release ----

  release:
    name: 创建 GitHub Release
    needs: [decide, build-windows, build-android, build-linux, build-macos]
    # 四个构建全部成功才出 Release。这里不再需要 always()：所有依赖都是
    # 硬门禁，不存在「允许失败」的构建任务了
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: 下载全部产物
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出产物
        run: ls -laR artifacts/

      - name: 生成 Release 说明
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          {
            echo "## omy v${VERSION}"
            echo
            echo "### 下载"
            echo
            echo "| 文件 | 平台 |"
            echo "|---|---|"
            echo "| \`*-x86_64-pc-windows-msvc.zip\` | Windows 10/11 x86_64（内置 FFmpeg，解压即用） |"
            echo "| \`*-x86_64-unknown-linux-gnu.tar.gz\` | Linux x86_64 |"
            echo "| \`*-aarch64-apple-darwin.tar.gz\` | macOS（Apple Silicon） |"
            echo "| \`*-x86_64-apple-darwin.tar.gz\` | macOS（Intel） |"
            echo "| \`*.apk\` | Android（四个 ABI，**未签名**） |"
            echo
            echo "### 平台验证状态"
            echo
            echo "| 平台 | CI 构建 | 真机实测 |"
            echo "|---|---|---|"
            echo "| Windows | ✅ | ✅ |"
            echo "| Android | ✅ | ✅ |"
            echo "| Linux | ✅ | ❌ 尚未实测 |"
            echo "| macOS（两种架构） | ✅ | ❌ 尚未实测 |"
            echo
            echo "Linux 与 macOS 只经过 CI 编译与打包，未在真实系统上运行过，"
            echo "可能存在运行时问题；这两个平台不内置 FFmpeg，需要自行安装或用"
            echo "\`OMY_FFMPEG\` / \`OMY_FFPROBE\` 指定。"
            echo
            echo "### 说明"
            echo
            echo "- \`omy\` 是命令行工具，\`omy-gui\` 是图形界面"
            echo "- APK **未签名**，安装需允许未知来源"
            echo "- 装完建议先跑 \`omy doctor\` 确认本机实际能力"
            echo
            echo "密码遗忘将导致数据永久丢失——设计上不存在找回机制。"
          } > notes.md
          cat notes.md

      - name: 创建 Release
        # tag_name 指向本次提交：标签不存在时 action 会自动创建
        # v{version}，发布入口因此只有一个（[publish] 提交），不再手工打 tag
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: v${{ needs.decide.outputs.version }}
          name: omy v${{ needs.decide.outputs.version }}
          body_path: notes.md
          files: artifacts/**/*
          # 所有平台都是硬门禁，理论上产物一定齐；仍保留宽松匹配以免
          # APK 文件名差异直接把 Release 步骤打挂
          fail_on_unmatched_files: false

  # ---- 发布到 crates.io ----

  publish:
    name: 发布到 crates.io
    # 与 Release 共享同一组构建门禁：crates.io 的版本发布后**无法删除**
    # （只能 yank，且版本号不能复用），这个不可撤销的动作不能在任何平台
    # 构建红着的时候发生。四个构建全绿才允许上传。
    needs: [decide, build-windows, build-android, build-linux, build-macos]
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # 走 environment 是为了给这个不可撤销的动作加一道人工闸门：
    # CARGO_REGISTRY_TOKEN 配在这个环境里，并可在仓库设置里给它加
    # required reviewers，这样上传前会停下来等人点确认。
    # 配置位置：Settings → Environments → crates-io
    environment:
      name: crates-io
      url: https://crates.io/crates/omy-cli
    steps:
      - uses: actions/checkout@v7

      - name: 安装系统依赖
        # 发布的是库与 CLI（omy-gui publish = false），不需要 WebKit，
        # 但部分依赖的 -sys 构建仍需要基础工具链与 openssl 头
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev pkg-config

      - name: 安装 Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: publish

      - name: 确认 token 已配置
        # dry-run **不需要** token 也能过，所以缺 token 时前面一路绿灯，
        # 直到真上传那步才报 no token found——而那时 cargo 可能已经发出去
        # 一部分包了（workspace 是逐个发的，发出去的删不掉）。
        # 所以在动任何东西之前先确认拿得到 secret。
        #
        # 只判空、不打印内容：token 等价于账号写权限
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::拿不到 CARGO_REGISTRY_TOKEN。"
            echo "本任务绑定了 crates-io 这个 environment，secret 要配在"
            echo "Settings → Environments → crates-io 里；配在仓库级 Secrets"
            echo "也可以读到，但配在 environment 里才能用 required reviewers。"
            exit 1
          fi
          echo "token 已就位（长度 ${#CARGO_REGISTRY_TOKEN}，内容不打印）"

      - name: 先做一次 dry-run
        # 真上传之前必须过一遍：crates.io 的版本发布后**无法删除**，
        # 只能 yank，而且同一个版本号不能再用。
        # dry-run 能抓出缺 version 的 path 依赖、缺失的元数据等问题。
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --dry-run

      - name: 发布
        # --workspace 让 cargo 自己算依赖顺序并等每个包在 registry 上可见后
        # 再发下一个，顺序为：
        #   omy-core → omy-config → omy-media → omy-net → omy-secret → omy-cli
        # omy-gui / omy-remote / spikes 在各自 Cargo.toml 里标了
        # publish = false，会被自动跳过。
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace

      - name: 汇总
        run: |
          echo "已发布 v${{ needs.decide.outputs.version }} 到 crates.io"
          echo "omy-core / omy-config / omy-media / omy-net / omy-secret / omy-cli"
          echo "omy-gui、omy-remote 与 spikes 不发布到 registry（见各自 Cargo.toml）"
