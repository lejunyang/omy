# 发布流水线。
#
# # 两个触发条件，对应两种发布动作
#
# 1. 推 v* 标签   → 构建各平台产物并创建 GitHub Release
# 2. 提交信息含 [publish] → 额外发布到 crates.io
#
# 分开是因为两者的可逆性完全不同：GitHub Release 删了可以重发，
# 而 **crates.io 的版本一经发布就无法删除**（只能 yank，且号不能复用）。
# 所以上传 registry 必须由提交信息里的显式标记触发，不能顺带发生。
#
# # 平台策略
#
# 与测试流水线一致：Windows 与 Android 是已验证平台，构建失败即发布失败；
# Linux 与 macOS 尚未验证，continue-on-error，缺了产物也照样出 Release
# （Release 说明里会写明这一点，不让用户以为下载到的是验证过的东西）。

name: 发布

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_crates:
        description: '同时发布到 crates.io（不可撤销）'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ---- 先判断这次要做什么 ----

  decide:
    name: 判定触发条件
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.d.outputs.release }}
      publish: ${{ steps.d.outputs.publish }}
      version: ${{ steps.d.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 需要读提交信息。fetch-depth: 0 是必须的：默认浅克隆下
          # git log 拿不到完整信息，判定会静默变成「不发布」
          fetch-depth: 0

      - name: 判定
        id: d
        env:
          # 提交信息经环境变量传入，不做字符串插值。
          # 直接把 ${{ github.event.head_commit.message }} 写进 shell 里，
          # 提交信息带反引号或 $() 就会被当成命令执行——这是脚本注入。
          MSG: ${{ github.event.head_commit.message }}
          MANUAL: ${{ inputs.publish_crates }}
        run: |
          release=false
          publish=false
          version=""

          # 推标签 → 出 Release
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            release=true
            version="${GITHUB_REF_NAME#v}"
          fi

          # 提交信息**首行**含 [publish] → 发 crates.io。
          #
          # 只看首行，是因为原先的全文子串匹配踩过一次：某次提交在正文里
          # 解释了「[publish] 这个标记怎么用」，结果那次推送直接触发了发布
          # 流水线。讨论、引用、revert 说明、把它写进注释，全都会误触发——
          # 而这是个**发出去就删不掉**的动作，不能靠「注意别提它」来避免。
          #
          # 首行是提交标题，写进标题即视为明确的发布意图。
          subject=$(printf '%s\n' "$MSG" | head -n 1)
          case "$subject" in
            *'[publish]'*) publish=true ;;
          esac

          # 手动触发时以输入为准
          if [ "$MANUAL" = "true" ]; then
            publish=true
          fi

          # 没有标签时从 Cargo.toml 读版本，供 crates.io 发布使用
          if [ -z "$version" ]; then
            version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          fi

          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          echo "出 Release   = $release"
          echo "发 crates.io = $publish"
          echo "版本         = $version"

  # ---- 构建产物 ----

  build-windows:
    name: 构建 Windows（已验证）
    needs: decide
    # 发 crates.io 时也要跑：publish 任务把这两个已验证平台的构建当作门禁，
    # 而**被跳过的依赖会让下游任务一起跳过**。这里只写 release 的话，
    # 不带标签的 [publish] 提交会让构建跳过，publish 也跟着跳过——
    # 表现是「明明写了 [publish] 却什么都没发」，且没有任何报错
    if: needs.decide.outputs.release == 'true' || needs.decide.outputs.publish == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust
        run: rustup toolchain install stable --profile minimal

      # omy-gui 的 build.rs 需要 pnpm，否则前端构建那步直接 panic。版本固定的理由见 test.yml 的 windows 任务
      - uses: actions/setup-node@v6.0.0
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 9.15.1

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: release-windows

      - name: 构建 CLI
        run: cargo build --release -p omy-cli

      - name: 构建 GUI
        # GUI 的 build.rs 会自动构建前端，所以这里不需要单独跑前端命令；
        # 但**必须**已经装好 Node 与 pnpm，见上面的说明
        run: cargo build --release -p omy-gui

      - name: 打包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target\release\omy.exe dist\
          Copy-Item target\release\omy-gui.exe dist\
          Copy-Item README.md dist\
          Compress-Archive -Path dist\* `
            -DestinationPath omy-${{ needs.decide.outputs.version }}-x86_64-pc-windows-msvc.zip

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: windows
          path: '*.zip'

  build-android:
    name: 构建 Android（已验证）
    needs: decide
    # 同 build-windows：发 crates.io 时也要跑，理由见那里
    if: needs.decide.outputs.release == 'true' || needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust 与 Android 目标
        run: |
          rustup toolchain install stable --profile minimal
          # APK 默认打四个 ABI（gen/android/buildSrc 里的 targetList），
          # 只装前两个时 gradle 会在编 x86 那一档才报错，而前面几档已经编了很久
          rustup target add aarch64-linux-android armv7-linux-androideabi \
            i686-linux-android x86_64-linux-android

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          # 与 osdk.toml 固定的 java 版本一致，理由见 test.yml 里的说明
          java-version: '21'

      - uses: android-actions/setup-android@v4.0.1

      - name: 安装 NDK
        env:
          NDK_VERSION: '29.0.14206865'
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: 指定交叉编译用的 C 编译器与链接器
        # cc-rs 找的是不带 API 级别的名字，而 NDK 只提供带级别的 wrapper，
        # 不指定的话 zstd-sys 会报「failed to find tool」。
        # 完整理由见 test.yml 里的同名步骤。
        #
        # 这里要配齐四个 ABI，与上面 rustup target add 的四个目标对应
        #
        # LINKER 也一并设上。APK 走 gradle 调 NDK 链接 .so，目前这条路径不依赖
        # 它，所以这里是**预防性**的：一旦将来在这个任务里直接 cargo build 出
        # 可执行文件（或 tauri 改了链接方式），缺它就会挂在
        # `error: linker `cc` not found`，而报错完全不提 Android。设上没有代价。
        env:
          API_LEVEL: '24'
        run: |
          BIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$BIN/aarch64-linux-android${API_LEVEL}-clang" || {
            echo "NDK 里没有 aarch64-linux-android${API_LEVEL}-clang，NDK 目录可能不完整"
            ls "$BIN" | head -50
            exit 1
          }
          {
            echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android${API_LEVEL}-clang"
            echo "CC_armv7_linux_androideabi=$BIN/armv7a-linux-androideabi${API_LEVEL}-clang"
            echo "CC_i686_linux_android=$BIN/i686-linux-android${API_LEVEL}-clang"
            echo "CC_x86_64_linux_android=$BIN/x86_64-linux-android${API_LEVEL}-clang"
            echo "AR_aarch64_linux_android=$BIN/llvm-ar"
            echo "AR_armv7_linux_androideabi=$BIN/llvm-ar"
            echo "AR_i686_linux_android=$BIN/llvm-ar"
            echo "AR_x86_64_linux_android=$BIN/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android${API_LEVEL}-clang"
            echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$BIN/armv7a-linux-androideabi${API_LEVEL}-clang"
            echo "CARGO_TARGET_I686_LINUX_ANDROID_LINKER=$BIN/i686-linux-android${API_LEVEL}-clang"
            echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$BIN/x86_64-linux-android${API_LEVEL}-clang"
          } >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      # 这里装 bun 是不够的：build.rs 按 frontend/ 下的 lockfile 选包管理器，
      # 看到 pnpm-lock.yaml 就只调 pnpm，不会退回 bun 或 npm
      - uses: actions/setup-node@v6.0.0
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 9.15.1

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: release-android

      - name: 安装 tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: 构建 APK
        working-directory: crates/omy-gui
        # 产出的是未签名 APK：签名密钥不能进仓库，也不该由 CI 代持。
        # 需要正式签名版时由维护者本地签，或另配 secrets 后在此加签名步骤。
        run: cargo tauri android build --apk

      - name: 收集 APK
        run: |
          mkdir -p out
          find . -name '*.apk' -path '*release*' -exec cp {} out/ \;
          ls -la out/

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: android
          path: out/*.apk

  build-linux:
    name: 构建 Linux（未验证）
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: 安装 Rust
        run: rustup toolchain install stable --profile minimal

      # omy-gui 的 build.rs 需要 pnpm，理由见 build-windows
      - uses: actions/setup-node@v6.0.0
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 9.15.1

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: release-linux

      - name: 构建
        run: |
          cargo build --release -p omy-cli
          cargo build --release -p omy-gui

      - name: 打包
        run: |
          mkdir -p dist
          cp target/release/omy target/release/omy-gui README.md dist/
          tar -czf omy-${{ needs.decide.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz -C dist .

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: linux
          path: '*.tar.gz'

  build-macos:
    name: 构建 macOS（未验证）
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust
        run: rustup toolchain install stable --profile minimal

      # omy-gui 的 build.rs 需要 pnpm，理由见 build-windows
      - uses: actions/setup-node@v6.0.0
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 9.15.1

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: release-macos

      - name: 构建
        run: |
          cargo build --release -p omy-cli
          cargo build --release -p omy-gui

      - name: 打包
        run: |
          mkdir -p dist
          cp target/release/omy target/release/omy-gui README.md dist/
          tar -czf omy-${{ needs.decide.outputs.version }}-aarch64-apple-darwin.tar.gz -C dist .

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: macos
          path: '*.tar.gz'

  # ---- 创建 Release ----

  release:
    name: 创建 GitHub Release
    needs: [decide, build-windows, build-android, build-linux, build-macos]
    # always()：linux/macos 允许失败，若用默认的「全部成功才跑」，
    # 未验证平台一挂就整个 Release 出不来，等于把它们变成了必过项
    if: always() && needs.decide.outputs.release == 'true' && needs.build-windows.result == 'success' && needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: 下载全部产物
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出产物
        run: ls -laR artifacts/

      - name: 生成 Release 说明
        env:
          LINUX_RESULT: ${{ needs.build-linux.result }}
          MACOS_RESULT: ${{ needs.build-macos.result }}
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          {
            echo "## omy v${VERSION}"
            echo
            echo "### 平台验证状态"
            echo
            echo "| 平台 | 状态 |"
            echo "|---|---|"
            echo "| Windows | 已实测 |"
            echo "| Android | 已实测 |"
            echo "| Linux | **尚未验证**（本次构建：${LINUX_RESULT}） |"
            echo "| macOS | **尚未验证**（本次构建：${MACOS_RESULT}） |"
            echo
            echo "Linux 与 macOS 的产物由未经验证的构建任务产出，可能缺失或不可用。"
            echo
            echo "### 说明"
            echo
            echo "- \`omy\` 是命令行工具，\`omy-gui\` 是图形界面"
            echo "- APK **未签名**，安装需允许未知来源"
            echo "- 装完建议先跑 \`omy doctor\` 确认本机实际能力"
            echo
            echo "密码遗忘将导致数据永久丢失——设计上不存在找回机制。"
          } > notes.md
          cat notes.md

      - name: 创建 Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          body_path: notes.md
          files: artifacts/**/*
          # 未验证平台可能缺产物，不能因此报错
          fail_on_unmatched_files: false

  # ---- 发布到 crates.io ----

  publish:
    name: 发布到 crates.io
    # 已验证平台的构建是门禁：crates.io 的版本发布后**无法删除**（只能 yank，
    # 且版本号不能复用），所以这个不可撤销的动作不能在构建红着的时候发生。
    #
    # 只挂 Windows 与 Android：它们是已验证平台，且 linux/macos 是
    # continue-on-error，挂上去等于把未验证平台变成了发布门禁。
    needs: [decide, build-windows, build-android]
    # always() 是必须的：没有它，只要有任何依赖不是 success 就整个跳过，
    # 而下面要做的恰恰是「显式检查依赖结果」。
    # 注意 result 要判 success 而不是 != failure——被跳过的依赖是 skipped，
    # 那种情况下门禁等于没设
    if: >-
      always()
      && needs.decide.outputs.publish == 'true'
      && needs.build-windows.result == 'success'
      && needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    # 走 environment 是为了给这个不可撤销的动作加一道人工闸门：
    # CARGO_REGISTRY_TOKEN 配在这个环境里，并可在仓库设置里给它加
    # required reviewers，这样上传前会停下来等人点确认。
    # 配置位置：Settings → Environments → crates-io
    environment:
      name: crates-io
      url: https://crates.io/crates/omy-cli
    steps:
      - uses: actions/checkout@v7

      - name: 安装系统依赖
        # omy-cli 依赖 omy-media 与 omy-net，publish 默认会验证构建。
        # 这些不需要 WebKit（omy-gui 才需要，而它 publish = false），
        # 但 openssl 等基础库仍要有
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev pkg-config

      - name: 安装 Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: publish

      - name: 确认 token 已配置
        # dry-run **不需要** token 也能过，所以缺 token 时前面一路绿灯，
        # 直到真上传那步才报 no token found——而那时 cargo 可能已经发出去
        # 一部分包了（workspace 是逐个发的，发出去的删不掉）。
        # 所以在动任何东西之前先确认拿得到 secret。
        #
        # 只判空、不打印内容：token 等价于账号写权限
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::拿不到 CARGO_REGISTRY_TOKEN。"
            echo "本任务绑定了 crates-io 这个 environment，secret 要配在"
            echo "Settings → Environments → crates-io 里；配在仓库级 Secrets"
            echo "也可以读到，但配在 environment 里才能用 required reviewers。"
            exit 1
          fi
          echo "token 已就位（长度 ${#CARGO_REGISTRY_TOKEN}，内容不打印）"

      - name: 先做一次 dry-run
        # 真上传之前必须过一遍：crates.io 的版本发布后**无法删除**，
        # 只能 yank，而且同一个版本号不能再用。
        # dry-run 能抓出缺 version 的 path 依赖、缺失的元数据等问题。
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --dry-run

      - name: 发布
        # --workspace 让 cargo 自己算依赖顺序（core → media → net → cli），
        # 并等每个包在 registry 上可见后再发下一个。
        # 手写顺序加 sleep 是旧做法，cargo 1.98 已经内置处理。
        #
        # omy-gui 在它的 Cargo.toml 里标了 publish = false，会被自动跳过：
        # 它的 build.rs 需要 Node 工具链，而前端产物不入库。
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace

      - name: 汇总
        run: |
          echo "已发布 v${{ needs.decide.outputs.version }} 到 crates.io"
          echo "omy-core / omy-media / omy-net / omy-cli"
          echo "omy-gui 不发布到 registry（见其 Cargo.toml 的说明）"
