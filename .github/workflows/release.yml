# 发布流水线。
#
# # 单一触发：提交标题含 [publish]
#
# 推送到 main 时，只看**本次推送最后一个提交**的标题（提交信息首行），
# 含 `[publish]` 才触发一次完整发布；也可在 Actions 页面手动触发。
# 不接受推 v* 标签触发：标签由本流水线在发布时创建，避免「打标签」和
# 「写 [publish]」两套入口各自只做一半动作。
#
# 只看最后一个提交（而不是遍历本次推送的每个提交）：发布意图应当由推送
# 链的顶端明确表达，而不是从一串中间提交里翻出来；这样旧提交里残留的
# 标记、或 rebase 进来的历史标记不会意外触发发布。
#
# 一次触发按顺序做两件事：
#
# 1. 构建 Windows / Linux / macOS（Apple Silicon + Intel）/ Android 全部产物，
#    桌面目标均另发独立 CLI，Linux CLI 覆盖 x86_64 / ARM64 的 GNU / musl；
#    全绿后创建 GitHub Release（自动打 v{version} 标签并挂产物）；
# 2. 发布到 crates.io（omy-core → omy-config → omy-secret → omy-media →
#    omy-net → omy-remote → omy-cli → omy-password-manager，共 8 个；
#    omy-gui / spikes 不发布）。
#
# 两者共享同一组构建门禁：任何一个平台构建失败，Release 与 crates.io 都不会动。
#
# # 为什么 crates.io 仍单独走 environment
#
# GitHub Release 删了可以重发，而 **crates.io 的版本一经发布就无法删除**
# （只能 yank，版本号不能复用）。所以 publish 任务绑定 `crates-io`
# environment：CARGO_REGISTRY_TOKEN 配在里面，并可加 required reviewers，
# 让上传前停下来等人确认。触发标记只决定「流水线跑不跑」，environment
# 闸门决定「包发不发得出去」。
#
# # 平台策略
#
# 所有构建任务全部是硬门禁（不再有 continue-on-error）：既然要发布三系统
# 桌面目标与 APK，哪个平台编不过就不该出 Release，否则用户下载到的就是
# 缺平台的版本。但「CI 构建通过」不等于「真机实测通过」——目前 Windows、
# Android 与 macOS（Apple Silicon）真正在真机上跑过 build/test/clippy；
# Linux 与 macOS（Intel）仅保证编译、打包与 FFmpeg 产物校验成功，
# 这一点会写进 Release 说明，不把两者混为一谈。
#
# # 内置 FFmpeg
#
# Windows / Linux / macOS（两种架构）产物都内置同一份自建裁剪 FFmpeg
# （含 H.264/HEVC，见 scripts/ffmpeg-build/），解压即用。各平台独立 CLI 包
# 与 Android 不内置。裁剪构建只在配方/版本/脚本或 omy-media 改动时在
# 「内置 FFmpeg」工作流里跑；本流水线在打包时再编一遍并作为门禁。

name: 发布

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_only:
        # 发布构建任务只在发布时跑，PR 的「测试」流水线覆盖不到。0.0.1 首次
        # 发布时 Android 与 Linux 两个构建都挂在配置问题上，而这些问题在
        # 合并前没有任何途径暴露。勾上它可以在分支上只验证构建：
        #   gh workflow run release.yml --ref <分支> -f build_only=true
        description: 只跑全部平台和 CLI 构建，不创建 Release、不发布 crates.io
        type: boolean
        default: false

# 发布是不可撤销（crates.io）或对外可见（Release）的动作，绝不为新推送
# 取消正在跑的旧发布
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ---- 先判断这次要不要发布 ----

  decide:
    name: 判定发布标记
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.d.outputs.publish }}
      version: ${{ steps.d.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: 判定
        id: d
        run: |
          publish=false

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # 手动触发即视为明确发布意图
            publish=true
          else
            # 只取本次推送**最后一个**提交的标题（message 的首行）。
            #
            # 不遍历全部提交：发布意图必须由推送链顶端的那个提交明确表达，
            # 不从一串中间提交里翻标记，避免历史/rebase 残留的 [publish]
            # 意外触发。
            #
            # 不把提交信息插值进 shell（反引号 / $() 会变成命令注入）：
            # jq 直接读 GITHUB_EVENT_PATH 这个 JSON 文件。
            #
            # 只看标题（首行）：正文里讨论「[publish] 怎么用」曾误触发过
            # 发布，而这是发出去删不掉的动作。
            # 空提交列表（极端情况，如删除 ref 的 push 事件）last 为 null，
            # 直接 .message|split 会让 jq 报错使整个判定失败，故先判长度。
            subject=$(jq -r '
              if (.commits | length) > 0
              then (.commits | last | .message | split("\n")[0])
              else "" end' "$GITHUB_EVENT_PATH")
            case "$subject" in
              *'[publish]'*) publish=true ;;
            esac
          fi

          # workspace 版本在根 Cargo.toml 的 [workspace.package]，
          # 该段里第一个独立的 version = "..." 即工作区统一版本
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)

          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "发布         = $publish"
          echo "版本         = $version"

  # ---- 构建产物：全部任务都是发布门禁 ----

  build-windows:
    name: 构建 Windows（已实测平台）
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: windows-latest
    # 上游下载失去响应时尽快失败，不能再等 GitHub 的 6 小时全局上限。
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust
        run: rustup toolchain install stable --profile minimal

      # omy-gui 的 build.rs 需要 pnpm，否则前端构建那步直接 panic。版本固定的理由见 test.yml 的 windows 任务
      - uses: actions/setup-node@v6.0.0
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 9.15.1

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: release-windows

      # ---- 内置 FFmpeg ----
      #
      # 装 osdk 而不是 MSYS2：本地开发用的就是根目录 osdk.toml 那套工具链，
      # CI 复用同一份配置才能保证「CI 里构建出来的 = 本地验证过的」。
      # 换成 MSYS2 等于维护第二套版本组合，而两套之间的漂移只会在产物里暴露。
      # 发布流水线用 @main 与最新 CLI（不固定版本）：发布前总要先在分支上跑一次
      # build_only，最新 osdk 若有问题会在那里暴露，而不是等到合并后。
      # 「内置 FFmpeg」工作流（ffmpeg.yml）同样跟随 main，两处改一处都要改。
      - name: 安装 osdk 并恢复工具缓存
        uses: lejunyang/one-sdk@main
        with:
          # Action 默认会在工作目录运行全量 install。改到无项目配置的临时目录，
          # 再由下一步只装 FFmpeg 所需工具，避免拉取 Android system image。
          working-directory: ${{ runner.temp }}
          install-tools: false
          install-deps: false
          cache-key: ffmpeg-tools

      - name: 信任 osdk.toml 并安装 FFmpeg 工具链
        shell: pwsh
        run: |
          # osdk.toml 含 conda: 工具，属于 trust-required。未信任时该目录下
          # **所有** osdk 命令都会失败，且报错不提「没信任」这件事
          osdk --yes trust osdk.toml
          # 这里只构建 Windows FFmpeg；裸 `osdk install` 会连 Android 模拟器与
          # system image 一起装，首次发布因此卡在 Google 镜像下载整整 6 小时。
          osdk -y install conda:gcc_win-64 conda:nasm conda:cmake conda:ninja conda:m2-base conda:libarchive
          # shim 目录要显式进 PATH，否则构建步骤的 bash 是 Git Bash，
          # 找不到 bsdtar / make / mingw gcc。理由见 ffmpeg.yml 同名步骤。
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $env:OSDK_DATA_DIR 'shims') -Encoding utf8

      - name: 确认 FFmpeg 构建所需命令均可用
        shell: pwsh
        run: pwsh -File scripts/ffmpeg-build/prepare-toolchain.ps1

      - name: 构建内置 FFmpeg
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'dist-ffmpeg'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          # OMY_FF_OUT 直接指向打包目录，省掉一次拷贝
          $env:OMY_FF_OUT = ($out -replace '\\', '/') -replace '^([A-Za-z]):', '/$1'
          & scripts/ffmpeg-build/prepare-toolchain.ps1 -Build

      - name: 校验 FFmpeg 产物
        shell: pwsh
        # 这是打包前的门禁，不是可选检查。configure 接受了参数却没启用组件时
        # **不报错**——configure 退出 0、make 退出 0，只有逐项复查才发现。
        # 发出去之后才暴露的话，用户装上就是「有的视频没缩略图」
        run: |
          $out = ((Join-Path $PWD 'dist-ffmpeg') -replace '\\', '/') -replace '^([A-Za-z]):', '/$1'
          bash scripts/ffmpeg-build/verify.sh $out
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg 产物校验未通过（退出码 $LASTEXITCODE）" }

      - name: 构建 CLI
        run: cargo build --release -p omy-cli

      - name: 构建 GUI
        # GUI 的 build.rs 会自动构建前端，所以这里不需要单独跑前端命令；
        # 但**必须**已经装好 Node 与 pnpm，见上面的说明
        run: cargo build --release -p omy-gui

      - name: 打包独立 CLI
        run: >-
          python scripts/package-cli.py --target x86_64-pc-windows-msvc
          --version ${{ needs.decide.outputs.version }} --binary target/release/omy.exe

      - name: 打包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target\release\omy.exe dist\
          Copy-Item target\release\omy-gui.exe dist\
          Copy-Item README.md dist\
          # FFmpeg 放 dist\ffmpeg\：omy-media 的 candidate_dirs() 会找
          # 「自身目录\ffmpeg」，所以解压即用，不需要用户配环境变量。
          # 放在子目录而不是与 omy.exe 平铺，是为了让用户一眼看出哪些文件
          # 是 FFmpeg 的，替换时不会误删
          New-Item -ItemType Directory -Path dist\ffmpeg -Force | Out-Null
          Copy-Item dist-ffmpeg\* dist\ffmpeg\ -Recurse
          Compress-Archive -Path dist\* `
            -DestinationPath omy-${{ needs.decide.outputs.version }}-x86_64-pc-windows-msvc.zip

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: windows
          path: '*.zip'

  build-android:
    name: 构建 Android APK（已实测平台）
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: 安装 osdk 并恢复 Android 构建缓存
        uses: lejunyang/one-sdk@main
        with:
          # 先只恢复缓存；根配置还含本地 E2E 才需要的 emulator/system image，
          # 下一步只安装 APK 构建所需的子集。
          working-directory: ${{ runner.temp }}
          install-tools: false
          install-deps: false
          cache-key: android-build

      - name: 安装 Android 构建工具链
        # 下面的 `osdk run` 要求 osdk.toml 里**在 Linux 上生效的全部非 lazy
        # 工具**都已安装，不管任务用不用得到。所以这里的清单必须覆盖那一整套，
        # 而不只是 APK 构建真正用到的：漏一个，构建一行没跑就失败。
        # conda:nasm 是给 Linux FFmpeg 构建的，APK 用不到，只为满足这条规则；
        # 模拟器与系统镜像在 osdk.toml 里标了 lazy，所以可以不装。
        # 往 osdk.toml 加 Linux 也生效的非 lazy 工具时，这里要一起加。
        run: |
          osdk --yes trust osdk.toml
          osdk -y install java rust node pnpm conda:nasm
          osdk -y install -o accept-licenses=true \
            android-ndk android-platform-tools android-build-tools \
            android-cmdline-tools android-platforms
          # 再装一份 build-tools 35.0.0：AGP 8.11 对没写 buildToolsVersion 的
          # 模块默认要 35，tauri-plugin-dialog 等插件子工程的 Gradle 文件在
          # 依赖包里改不了。SDK 里没有时 Gradle 会自行下载，但 osdk 只写下
          # 新版许可的哈希，Gradle 认不出 35 用的旧版许可，报
          # `License for package Android SDK Build-Tools 35 not accepted`。
          # 由 osdk 装则会补写旧版许可、把 35 链进 SDK 根，Gradle 不再下载
          # ——本机就是这个状态。升级 AGP 后它的默认版本变了，这里跟着改。
          osdk -y install -o accept-licenses=true android-build-tools@35.0.0
          echo "NDK_HOME=$(osdk -q where android-ndk | tail -n 1)" >> "$GITHUB_ENV"

      - name: 修复 NDK 里被解压成普通文件的符号链接
        # osdk 0.0.9 解 zip 时不还原符号链接：NDK r29 Linux 包里的 37 个
        # 链接（clang -> clang-21、ld -> ld.lld 等）被写成「内容是目标名」
        # 的小文本文件。执行 clang 时 shell 把它当脚本跑，再去 PATH 里找
        # `clang-21`——命中 osdk 的 shim，而 shim 在 cargo 构建脚本的工作
        # 目录（CARGO_HOME 里的 crate 源码，不在本项目内）选不到 NDK 版本，
        # 于是 aws-lc-sys 报 `osdk-shim: no version of android-ndk selected`。
        #
        # 这是 osdk 的缺陷（pipeline/extract.rs 的 unpack_zip），修好并发版
        # 前在这里兜底。判定规则：小于 256 字节、单行、不是脚本、且内容指向
        # 同目录下真实存在的文件——已用 NDK r29 实测，恰好命中 zip 里全部
        # 37 个链接，不误伤其它文件；重复执行时 find -type f 不再匹配到它们。
        # 缓存里恢复出来的旧安装同样是坏的，所以每次都要跑。
        run: |
          n=0
          while IFS= read -r -d '' f; do
            target="$(head -c 4096 "$f")"
            case "$target" in ''|*$'\n'*|'#!'*) continue ;; esac
            [ -e "$(dirname "$f")/$target" ] || continue
            ln -sfn "$target" "$f"
            n=$((n + 1))
          done < <(find "$NDK_HOME" -type f -size -256c -print0)
          echo "已把 ${n} 个符号链接残片恢复为符号链接"
          "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version | head -1

      - name: 指定交叉编译用的 C 编译器与链接器
        # cc-rs 找的是不带 API 级别的名字，而 NDK 只提供带级别的 wrapper，
        # 不指定的话 zstd-sys 会报「failed to find tool」。
        # 完整理由见 test.yml 里的同名步骤。
        #
        # 发布只构建 ARM64 / x86_64 两个 ABI；osdk.toml [tools].rust.targets
        # 已安装对应目标，任务里不再重复 rustup target add。
        #
        # LINKER 也一并设上。APK 走 gradle 调 NDK 链接 .so，目前这条路径不依赖
        # 它，所以这里是**预防性**的：一旦将来在这个任务里直接 cargo build 出
        # 可执行文件，缺它就会挂在 `error: linker `cc` not found`。
        env:
          API_LEVEL: '24'
        run: |
          BIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for compiler in aarch64-linux-android x86_64-linux-android; do
            test -x "$BIN/${compiler}${API_LEVEL}-clang" || {
              echo "NDK 里没有 ${compiler}${API_LEVEL}-clang，NDK 目录可能不完整"
              ls "$BIN" | head -50
              exit 1
            }
          done
          {
            echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android${API_LEVEL}-clang"
            echo "CC_x86_64_linux_android=$BIN/x86_64-linux-android${API_LEVEL}-clang"
            echo "AR_aarch64_linux_android=$BIN/llvm-ar"
            echo "AR_x86_64_linux_android=$BIN/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android${API_LEVEL}-clang"
            echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$BIN/x86_64-linux-android${API_LEVEL}-clang"
          } >> "$GITHUB_ENV"

      - name: 构建 APK
        # 产出的是未签名 APK：签名密钥不能进仓库，也不该由 CI 代持。
        # 需要正式签名版时由维护者本地签，或另配 secrets 后在此加签名步骤。
        run: osdk run --no-deps android-release-build

      - name: 收集 APK
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import zipfile

          root = Path('crates/omy-gui/gen/android/app/build/outputs/apk')
          output = Path('out')
          output.mkdir(exist_ok=True)
          for flavor, abi, label in [('arm64', 'arm64-v8a', 'arm64'), ('x86_64', 'x86_64', 'x64')]:
              source = root / flavor / 'release' / f'app-{flavor}-release-unsigned.apk'
              with zipfile.ZipFile(source) as apk:
                  names = apk.namelist()
                  actual = {name.split('/')[1] for name in names if name.startswith('lib/') and name.endswith('.so')}
                  # 文件名可能误标架构；检查实际原生库，拒绝混入 32 位或通用包。
                  if actual != {abi} or f'lib/{abi}/libomy_gui_lib.so' not in names:
                      raise SystemExit(f'{source} 的 ABI 不符合预期：实际 {actual}，预期 {abi}')
              destination = output / f"omy-{os.environ['VERSION']}-android-{label}.apk"
              shutil.copyfile(source, destination)
              print(f'{destination}: {abi}, {destination.stat().st_size} bytes')
          PY

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: android
          path: |
            out/*-android-arm64.apk
            out/*-android-x64.apk
          if-no-files-found: error

  build-linux:
    name: 构建 Linux x86_64 发行包（已在本机实测核心功能）
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    # 固定 ubuntu-22.04 而不用 latest：发行包对旧发行版的兼容性取决于构建机
    # 的 glibc/系统库版本（22.04 为 glibc 2.35）。在最新版上构建出来的包
    # 拿到 Debian 12 等系统上会因 GLIBC 符号版本缺失而运行即崩，而 deb 的
    # Depends 不含 glibc 符号版本、apt 拦不住。AppImage 同理。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: 安装系统依赖
        # Tauri v2 需要 WebKitGTK 4.1；rpm 包由 Tauri 用纯 Rust rpm crate
        # 生成，不需要 rpm/rpmbuild
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev pkg-config cmake \
            libayatana-appindicator3-dev librsvg2-dev

      - name: 安装 Rust
        run: rustup toolchain install stable --profile minimal

      - name: 安装 osdk 并恢复工具缓存
        uses: lejunyang/one-sdk@main
        with:
          working-directory: ${{ runner.temp }}
          install-tools: false
          install-deps: false
          cache-key: ffmpeg-tools

      - name: 信任 osdk.toml
        # syspkg 段与 conda: 工具属于 trust-required；未信任时所有 osdk 命令
        # 都会失败（报错不提「没信任」）。本任务只装 nasm，不触碰 Android
        # 工具，所以也不需要接受 Android SDK 许可。
        run: |
          osdk --yes trust osdk.toml
          # 只装 FFmpeg 构建所需的 nasm，避免把安卓整套工具链也拉下来。
          osdk -y install conda:nasm

      # omy-gui 的 build.rs 需要 pnpm，理由见 build-windows
      - uses: actions/setup-node@v6.0.0
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 9.15.1

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: release-linux

      - name: 构建内置 FFmpeg
        # OMY_FF_OUT 指向 tauri.conf.json 声明的 resources 源目录
        # crates/omy-gui/vendor-ffmpeg，bundle 时原样收进三种发行包
        run: |
          OMY_FF_OUT="$PWD/crates/omy-gui/vendor-ffmpeg" \
            bash scripts/ffmpeg-build/build-linux.sh

      - name: 校验 FFmpeg 产物
        # 打包前门禁，理由同 Windows：configure/make 退出 0 不代表需要的
        # 组件真的启用了，逐项复查才能发现
        run: bash scripts/ffmpeg-build/verify.sh crates/omy-gui/vendor-ffmpeg

      - name: 安装 tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: 构建前端
        # 不能指望 build.rs 来构建前端：tauri build 在 cargo 编译、也就是
        # build.rs 有机会运行**之前**就先校验 frontendDist，dist/ 不在就报
        # `Unable to find your web assets`。0.0.1 首次发布就挂在这里。
        # 与 osdk.toml 的 android-release-build 任务是同一个原因、同一个做法。
        # 产物落在 crates/omy-gui/dist（vite outDir 是 ../dist）。
        working-directory: crates/omy-gui
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build

      - name: 构建并生成发行包（deb/rpm/AppImage）
        # 单独走 tauri build，不直接 cargo build --release：要按
        # tauri.conf.json 的 bundle.targets 生成三种包。前端已由上一步构建好。
        # tauri-cli 2.x 的 build 不支持 -p，在 crate 目录下执行即构建该包
        working-directory: crates/omy-gui
        run: cargo tauri build

      - name: 收集产物
        run: |
          mkdir -p out
          find target/release/bundle -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} out/ \;
          ls -la out/

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: linux
          path: out/*

  build-linux-cli:
    name: 构建 Linux CLI（${{ matrix.target }}）
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      - name: 安装 CLI 构建依赖
        # 两个架构都原生构建，避免交叉链接时误用宿主 glibc/DBus 库。
        # GNU 保持 glibc 2.35 基线；musl 的 D-Bus 客户端由 vendored 特性静态编入。
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake perl pkg-config libdbus-1-dev musl-tools

      - name: 安装 Rust
        run: rustup toolchain install stable --profile minimal --target "$TARGET"

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: release-cli-${{ matrix.target }}

      - name: 构建 CLI
        run: |
          if [[ "$TARGET" == *-musl ]]; then
            # musl-gcc 只编 C 依赖；Rust 默认链接器使用自带 CRT。
            # 把 musl-gcc 当链接器会混入另一套启动对象，产物编过却启动崩溃。
            export CC=musl-gcc
          fi
          cargo build --locked --release -p omy-cli --target "$TARGET"

      - name: 校验 musl 没有动态库依赖
        if: endsWith(matrix.target, '-musl')
        # 只看文件名不能证明真静态：带解释器或 NEEDED 的包到 Alpine 仍会启动失败。
        run: |
          binary="target/$TARGET/release/omy"
          file "$binary"
          program_headers="$(readelf -l "$binary")"
          dynamic_tags="$(readelf -d "$binary")"
          if [[ "$program_headers" == *INTERP* ]]; then
            echo 'musl CLI 不应依赖动态加载器'
            exit 1
          fi
          if [[ "$dynamic_tags" == *NEEDED* ]]; then
            echo 'musl CLI 不应依赖动态库'
            exit 1
          fi

      - name: 打包并启动解包后的 CLI
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: >-
          python3 scripts/package-cli.py --target "$TARGET" --version "$VERSION"
          --binary "target/$TARGET/release/omy"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: '*-cli.tar.gz'
          if-no-files-found: error

  build-macos:
    name: 构建 macOS（Apple Silicon 已真机实测，Intel 仅交叉构建）
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 osdk 并恢复缓存
        uses: lejunyang/one-sdk@main
        with:
          working-directory: ${{ runner.temp }}
          install-tools: false
          install-deps: false
          cache-key: release-macos

      - name: 信任 osdk.toml 并安装 Rust
        # 同时出 Apple Silicon 与 Intel 两份：macos-latest 是 arm64 机器，
        # x86_64 靠交叉编译。GitHub runner 的系统框架（WebKit 等）是
        # universal 的，osdk install rust 装工具链时按 osdk.toml
        # [tools].rust.targets 一并装好 aarch64/x86_64-apple-darwin，
        # 不再单独 rustup target add。
        #
        # 但装完后 PATH 上的 cargo 仍是 runner 自带那份（只有宿主目标），
        # 所以下面的 cargo 一律经 `osdk exec --tool rust` 调起，理由详见
        # test.yml Android 任务的同名步骤。
        run: |
          osdk --yes trust osdk.toml
          osdk -y install rust
          installed="$(osdk -q exec --tool rust -- rustup target list --installed)"
          grep -qx 'aarch64-apple-darwin' <<<"$installed"
          grep -qx 'x86_64-apple-darwin' <<<"$installed"

      # omy-gui 的 build.rs 需要 pnpm，理由见 build-windows
      - uses: actions/setup-node@v6.0.0
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 9.15.1

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: release-macos

      # ---- 内置 FFmpeg（两架构）----
      # 与 Windows / Linux 同一份裁剪配方（scripts/ffmpeg-build/），分别编出
      # arm64 与 x86_64 两份，再按架构塞进对应 tarball 的 ffmpeg/ 子目录——
      # omy-media 的 candidate_dirs() 会找「自身目录/ffmpeg」，解压即用，
      # 不需要用户配环境变量。runner 是 arm64，x86_64 靠 -arch 交叉编、
      # 经 Rosetta 跑 verify.sh。
      - name: 安装 FFmpeg 构建前置
        run: brew install pkg-config nasm cmake

      - name: 构建并校验 arm64 FFmpeg
        run: |
          OMY_FF_OUT="$PWD/dist-ffmpeg-arm64" ARCH=arm64 \
            bash scripts/ffmpeg-build/build-macos.sh
          bash scripts/ffmpeg-build/verify.sh "$PWD/dist-ffmpeg-arm64"

      - name: 构建并校验 x86_64 FFmpeg
        run: |
          OMY_FF_OUT="$PWD/dist-ffmpeg-x86_64" ARCH=x86_64 \
            bash scripts/ffmpeg-build/build-macos.sh
          bash scripts/ffmpeg-build/verify.sh "$PWD/dist-ffmpeg-x86_64"

      - name: 构建 Apple Silicon
        run: osdk -q exec --tool rust -- cargo build --release -p omy-cli -p omy-gui --target aarch64-apple-darwin

      - name: 构建 Intel（交叉编译）
        run: osdk -q exec --tool rust -- cargo build --release -p omy-cli -p omy-gui --target x86_64-apple-darwin

      - name: 打包
        run: |
          version='${{ needs.decide.outputs.version }}'
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            python3 scripts/package-cli.py --target "$target" --version "$version" \
              --binary "target/$target/release/omy"
          done
          mkdir -p dist-arm/ffmpeg dist-x86/ffmpeg
          cp target/aarch64-apple-darwin/release/omy \
             target/aarch64-apple-darwin/release/omy-gui README.md dist-arm/
          cp target/x86_64-apple-darwin/release/omy \
             target/x86_64-apple-darwin/release/omy-gui README.md dist-x86/
          # 对应架构的 FFmpeg 放进 ffmpeg/ 子目录（含 COPYING.LGPLv2.1 与
          # SOURCE.txt）。按架构分开放，别把 x86_64 塞进 arm64 包。
          cp dist-ffmpeg-arm64/* dist-arm/ffmpeg/
          cp dist-ffmpeg-x86_64/* dist-x86/ffmpeg/
          tar -czf "omy-${version}-aarch64-apple-darwin.tar.gz" -C dist-arm .
          tar -czf "omy-${version}-x86_64-apple-darwin.tar.gz" -C dist-x86 .

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: macos
          path: '*.tar.gz'

  # ---- 创建 GitHub Release ----

  release:
    name: 创建 GitHub Release
    needs: [decide, build-windows, build-android, build-linux, build-linux-cli, build-macos]
    # 所有构建全部成功才出 Release。这里不再需要 always()：所有依赖都是
    # 硬门禁，不存在「允许失败」的构建任务了。
    # 另外两条：build_only 只验证构建；只从 main 发布——手动触发可以选
    # 任意分支，忘勾 build_only 时不能把分支上的代码当正式版发出去。
    # （publish 任务有同样的条件，改一处两处都要改）
    if: >-
      needs.decide.outputs.publish == 'true'
      && github.event.inputs.build_only != 'true'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: 下载全部产物
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出产物
        run: ls -laR artifacts/

      - name: 生成 Release 说明
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          {
            echo "## omy v${VERSION}"
            echo
            echo "### 下载"
            echo
            echo "| 文件 | 平台 |"
            echo "|---|---|"
            echo "| \`*-x86_64-pc-windows-msvc.zip\` | Windows 10/11 x86_64（内置 FFmpeg，解压即用） |"
            echo "| \`*-x86_64-pc-windows-msvc-cli.zip\` | Windows x86_64 独立 CLI |"
            echo "| \`*.deb\` / \`*.rpm\` | Linux x86_64（Debian/Ubuntu/Fedora 等，内置 FFmpeg） |"
            echo "| \`*.AppImage\` | Linux x86_64（免安装，内置 FFmpeg） |"
            echo "| \`*-x86_64-unknown-linux-gnu-cli.tar.gz\` / \`*-aarch64-unknown-linux-gnu-cli.tar.gz\` | Linux x86_64 / ARM64 独立 CLI（glibc） |"
            echo "| \`*-x86_64-unknown-linux-musl-cli.tar.gz\` / \`*-aarch64-unknown-linux-musl-cli.tar.gz\` | Linux x86_64 / ARM64 静态 CLI（musl，适用 Alpine） |"
            echo "| \`*-aarch64-apple-darwin.tar.gz\` | macOS（Apple Silicon，内置 FFmpeg） |"
            echo "| \`*-x86_64-apple-darwin.tar.gz\` | macOS（Intel，内置 FFmpeg） |"
            echo "| \`*-aarch64-apple-darwin-cli.tar.gz\` / \`*-x86_64-apple-darwin-cli.tar.gz\` | macOS Apple Silicon / Intel 独立 CLI |"
            echo "| \`*-android-arm64.apk\` | Android ARM64（arm64-v8a，**未签名**） |"
            echo "| \`*-android-x64.apk\` | Android x64（x86_64，**未签名**） |"
            echo
            echo "### 平台验证状态"
            echo
            echo "| 平台 | CI 构建 | 真机实测 |"
            echo "|---|---|---|"
            echo "| Windows | ✅ | ✅ |"
            echo "| Android | ✅ | ✅ |"
            echo "| Linux（deb/rpm/AppImage/CLI） | ✅ | ⚠️ 核心功能本机测试通过，发行包安装未逐项实测 |"
            echo "| macOS（Apple Silicon） | ✅ | ✅ build/test/clippy 已在真机跑通 |"
            echo "| macOS（Intel） | ✅ | ❌ 仅交叉编译/打包与 FFmpeg 产物校验，未在 Intel 真机运行 |"
            echo
            echo "Linux 发行包在 Ubuntu 22.04（glibc 2.35）上构建，Debian 12、"
            echo "Ubuntu 22.04 及更新的发行版可用；deb/rpm 安装后 \`omy-gui\` 位于"
            echo "应用菜单，内置 FFmpeg 随包安装。CLI 裸包不内置 FFmpeg，需要自行"
            echo "安装或用 \`OMY_FFMPEG\` / \`OMY_FFPROBE\` 指定。musl CLI 静态链接，"
            echo "不依赖 glibc；保存凭据仍需要运行中的 D-Bus 与 Secret Service。Windows 与 macOS"
            echo "（两种架构）的综合包内置 FFmpeg 于 \`ffmpeg/\` 子目录；独立 CLI 包均不内置。"
            echo "macOS Apple Silicon 已在真机跑通 build/test/clippy，Intel 产物仅经过"
            echo "CI 交叉编译、打包与 FFmpeg 产物校验，未在 Intel 真机上运行过。"
            echo
            echo "### 说明"
            echo
            echo "- \`omy\` 是命令行工具，\`omy-gui\` 是图形界面"
            echo "- APK **未签名**，需自行签名后安装，并允许未知来源"
            echo "- AppImage 若无 FUSE，可用 \`./omy_*.AppImage --appimage-extract-and-run\` 运行"
            echo "- 装完建议先跑 \`omy doctor\` 确认本机实际能力"
            echo
            echo "密码遗忘将导致数据永久丢失——设计上不存在找回机制。"
          } > notes.md
          cat notes.md

      - name: 创建 Release
        # tag_name 指向本次提交：标签不存在时 action 会自动创建
        # v{version}，发布入口因此只有一个（[publish] 提交），不再手工打 tag
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: v${{ needs.decide.outputs.version }}
          name: omy v${{ needs.decide.outputs.version }}
          body_path: notes.md
          files: artifacts/**/*
          # 所有平台都是硬门禁，理论上产物一定齐；仍保留宽松匹配以免
          # APK 文件名差异直接把 Release 步骤打挂
          fail_on_unmatched_files: false

  # ---- 发布到 crates.io ----

  publish:
    name: 发布到 crates.io
    # 与 Release 共享同一组构建门禁：crates.io 的版本发布后**无法删除**
    # （只能 yank，且版本号不能复用），这个不可撤销的动作不能在任何平台
    # 构建红着的时候发生。所有构建（含 Linux CLI 矩阵）全绿才允许上传。
    needs: [decide, build-windows, build-android, build-linux, build-linux-cli, build-macos]
    # 条件与 release 任务相同，理由见那里（改一处两处都要改）
    if: >-
      needs.decide.outputs.publish == 'true'
      && github.event.inputs.build_only != 'true'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 首次发布 8 个全新包：前 5 个连发，后 3 个每个前面等 10 分钟限流冷却，
    # 加上每个包 cargo publish 自带的编译校验，正常首次约 45 分钟；再留出
    # 一次 429 重试（又一个冷却窗口）的余量。显式写出来，排队时知道要等多久。
    timeout-minutes: 120
    # 走 environment 是为了给这个不可撤销的动作加一道人工闸门：
    # CARGO_REGISTRY_TOKEN 配在这个环境里，并可在仓库设置里给它加
    # required reviewers，这样上传前会停下来等人点确认。
    # 配置位置：Settings → Environments → crates-io
    environment:
      name: crates-io
      url: https://crates.io/crates/omy-cli
    steps:
      - uses: actions/checkout@v7

      - name: 安装系统依赖
        # 发布的是库与 CLI（omy-gui publish = false），不需要 WebKit，
        # 但部分依赖的 -sys 构建仍需要基础工具链与 openssl 头。
        #
        # libdbus-1-dev：omy-secret 在 Linux 上经 keyring → dbus-secret-service
        # 依赖 libdbus-sys，它的 build.rs 用 pkg-config 找 dbus-1，找不到直接
        # panic。Linux 构建任务从没报过，是因为 libwebkit2gtk-4.1-dev 间接装了
        # 它；本任务不装 WebKit，首次发布 0.0.1 就在 dry-run 校验 omy-secret 时
        # 失败。给 omy-secret 等发布包加新的 -sys 依赖时，要在这里补对应的
        # 开发包，不能指望 Linux 构建任务替它暴露。
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev pkg-config libdbus-1-dev

      - name: 安装 Rust
        run: rustup toolchain install stable --profile minimal

      # 不用 rust-cache，且校验与上传都在 runner.temp 下的全新 target 里编：
      # cargo 认为 registry 来源的包「版本相同即内容相同」，不会因源码变了
      # 而重编。dry-run 时 omy-core 0.0.1 是以 registry 依赖的身份编进
      # target 的；缓存把它带到下一次运行后，修了代码再发同一个版本，校验
      # 用的仍是旧的 omy-core 编译产物——本地实测过，表现为「函数明明在，
      # 却报 cannot find function」。首次发布反正要等约 45 分钟限流，
      # 省下的那几分钟编译不值得冒这个险。
      - name: 指定全新的 target 目录
        run: echo "CARGO_TARGET_DIR=${{ runner.temp }}/publish-target" >> "$GITHUB_ENV"

      - name: 确认 token 已配置
        # dry-run **不需要** token 也能过，所以缺 token 时前面一路绿灯，
        # 直到真上传那步才报 no token found——而那时 cargo 可能已经发出去
        # 一部分包了（workspace 是逐个发的，发出去的删不掉）。
        # 所以在动任何东西之前先确认拿得到 secret。
        #
        # 只判空、不打印内容：token 等价于账号写权限
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::拿不到 CARGO_REGISTRY_TOKEN。"
            echo "本任务绑定了 crates-io 这个 environment，secret 要配在"
            echo "Settings → Environments → crates-io 里；配在仓库级 Secrets"
            echo "也可以读到，但配在 environment 里才能用 required reviewers。"
            exit 1
          fi
          echo "token 已就位（长度 ${#CARGO_REGISTRY_TOKEN}，内容不打印）"

      - name: 先做一次 dry-run
        # 真上传之前必须过一遍：crates.io 的版本发布后**无法删除**，
        # 只能 yank，而且同一个版本号不能再用。
        # dry-run 能抓出缺 version 的 path 依赖、缺失的元数据等问题。
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --dry-run

      - name: 发布
        # 逐个发，不用 cargo publish --workspace：crates.io 对**新 crate**
        # 限流是 burst 5 个、之后每 10 分钟 1 个，而首次要发 8 个全新包，
        # 一把梭第 6 个起必然 429。脚本按依赖顺序发，前 5 个新包后每个新包
        # 前等待冷却，并查询 crates.io API 区分「新包」与「发新版本」；
        # 本版本已上传过的包直接跳过，所以中途失败后重跑流水线是安全的。
        # 详见 scripts/publish-crates.sh。
        #
        # omy-gui / spikes 在各自 Cargo.toml 里标了 publish = false，
        # 脚本的发布清单里本就没有它们。
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-crates.sh

      - name: 汇总
        run: |
          echo "已发布 v${{ needs.decide.outputs.version }} 到 crates.io"
          echo "omy-core / omy-config / omy-secret / omy-media / omy-net / omy-remote / omy-cli / omy-password-manager"
          echo "omy-gui 与 spikes 不发布到 registry（见各自 Cargo.toml）"
