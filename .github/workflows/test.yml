# 测试流水线。
#
# # 平台策略：为什么 Linux/macOS 允许失败
#
# 这个项目目前只在 Windows 与 Android 上实测过。Linux 与 macOS 的代码路径
# 写了但从未在真机上跑过，直接设成必过会让 main 长期挂红——那样红叉就失去
# 意义，真正的回归也会被忽略。
#
# 所以分成两类：
#   - windows / android：必过，挂了就是真的坏了
#   - linux / macos：continue-on-error，只作为「未来要修什么」的信息来源
#
# 等某个平台连续绿了并且有人真的在上面用过，就把它的 continue-on-error 删掉，
# 同时改掉 site 与 README 里「尚未验证」的说法。
#
# # 为什么必过任务用 stable 而不是 MSRV
#
# Cargo.toml 声明 rust-version = "1.88"。1.85 已不足以解析 grammers-mtsender
# 依赖的 hickory 0.26.3；1.88 是这条依赖链公开声明的真实下限。
#
# 但仍先不把它设成门禁，等它在 CI 上连续绿了再提升——首次核实时就抓到 5 处
# let-chain（`if let Some(x) = a && cond`，1.88 才稳定），说明这条线以前没人
# 盯，短期内还可能再冒出别的。
#
# 所以：必过任务用 stable，MSRV 单独一个非阻塞任务去核实。

name: 测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 允许手动触发，便于在改完平台适配后单独验一次
  workflow_dispatch:

# 同一分支上新的推送会取消仍在跑的旧任务：这里的任务动辄十几分钟，
# 连续推几次会把并发额度堆满
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI 上没人看增量编译的收益，关掉能少占缓存空间
  CARGO_INCREMENTAL: 0
  # 编译失败时直接给出可读的 backtrace，省一轮复现
  RUST_BACKTRACE: 1

jobs:
  # ---- 已验证平台：必过 ----

  windows:
    name: Windows（已验证）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust
        run: rustup toolchain install stable --profile minimal --component clippy

      # omy-gui 的 build.rs 在 dist/ 缺失时会跑 pnpm 构建前端，而 dist/ 不入库，
      # 所以**每个编 omy-gui 的任务都必须先装 Node 与 pnpm**。
      #
      # runner 镜像自带 node 与 npm，但**不带 pnpm**。缺它时 build.rs 直接 panic，
      # 而报错长得跟 Rust 毫无关系——Windows 上是
      # 「'pnpm' is not recognized as an internal or external command」（退出码 1），
      # Linux/macOS 上是「无法执行 pnpm（No such file or directory）」（退出码 101）。
      #
      # 这里显式装 Node 而不依赖镜像自带的版本：镜像的 node 会随时间变，
      # 而 setup-node 也顺带提供 pnpm 需要的 npm。
      - uses: actions/setup-node@v6.0.0
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6.1.0
        with:
          # 必须写 version：本仓库根目录没有 package.json，
          # 这个 action 读不到 packageManager 字段时会要求显式给版本。
          #
          # 固定 9.15.1（与本机一致），不写 latest：
          # frontend/pnpm-lock.yaml 是 lockfileVersion 9.0，pnpm 跨大版本会改
          # lockfile 格式与默认行为，让 CI 装出一棵和本地不同的依赖树
          version: 9.15.1

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: windows

      # FFmpeg 是可选依赖，但没有它时 omy-media 的一批测试只能跳过
      # （有损 WebP 编码、抽帧、探测都要它）。runner 镜像不带 ffmpeg，
      # 装上才能真正覆盖这些路径，否则 CI 绿了也不代表它们没坏。
      #
      # 「没装 FFmpeg 时如何降级」由单元测试直接调降级函数来覆盖，
      # 不依赖 runner 缺不缺 ffmpeg，所以这里装了不会掩盖那条路径。
      #
      # 这里刻意装的是**系统** FFmpeg，而不是我们自建的那份。两者各测一件事：
      #   这里          —— 用户自备 FFmpeg 的场景（omy 找 PATH 的那条路径）
      #   ffmpeg-build  —— 我们要内置进 Windows 产物的那份配方
      # 都要测：发出去的是自建那份，但用户仍可用 OMY_FFMPEG 换成自己的。
      - name: 安装 FFmpeg
        run: choco install ffmpeg --no-progress -y

      - name: 构建
        run: cargo build --workspace --all-targets

      - name: 测试
        run: cargo test --workspace

      - name: clippy
        # -D warnings 是刻意的：omy-gui 禁用 unwrap/expect/panic/切片索引，
        # 这些在加密与文件操作里会变成数据丢失或拒绝服务，不能只当建议
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 这里**不加** cargo fmt --check。
      #
      # 实测当前有 89 个文件、649 处不符合 rustfmt 默认风格：本仓库的中文注释
      # 与对齐是手写的，rustfmt 会把它们重排。加这个门禁会让 CI 从第一次运行
      # 就红，而唯一的修法是全仓库重排格式——那是独立的决定，不该顺带塞进
      # 「新增流水线」这件事里。AGENTS.md 的提交前要求也只列了 test 与 clippy。
      #
      # 若将来要引入，正确顺序是：先单独提一次全仓库 fmt，再加这一步。

  android:
    name: Android（已验证）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust 与 Android 目标
        # 带上 clippy：minimal profile 不含它，而下面要跑 Android 目标的 clippy
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup target add aarch64-linux-android armv7-linux-androideabi

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          # 21，与仓库根 osdk.toml 固定的 java 版本一致。
          #
          # 不能用更高的：Gradle 8.14 最高支持 JDK 24，而 Kotlin 1.9.25 的
          # JVM target 上限是 21，两条约束叠加后 21 就是上限。JDK 26 会让
          # gradle 在配置期崩溃，报错只有一行版本号，完全看不出是 JDK 的问题。
          #
          # 也不能用更低的 17：本地已经固定成 21，CI 用别的版本就失去了
          # 「CI 复现本地」的意义。改这里必须同时改 osdk.toml。
          java-version: '21'

      - uses: android-actions/setup-android@v4.0.4

      - name: 安装 NDK
        # zstd-sys 是 C 代码，交叉编译必须有 NDK 里的 clang。
        # 缺它的话连 omy-core 都编不过，而报错看起来跟 Tauri 毫无关系。
        #
        # 版本与 osdk.toml 的 android-ndk 一致；两边不一致时，本地能编过而
        # CI 编不过（或反过来），排查方向会完全跑偏
        env:
          NDK_VERSION: '29.0.14206865'
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: 指定交叉编译用的 C 编译器与链接器
        # 只装 NDK 是不够的：cc-rs 找的是 `aarch64-linux-android-clang` 这个
        # **不带 API 级别**的名字，而 NDK 从 r19 起只提供带级别的 wrapper
        # （aarch64-linux-android24-clang 等）。实测 NDK 29 里确实没有不带级别
        # 的那个，于是 zstd-sys 的 build script 报
        # 「failed to find tool "aarch64-linux-android-clang"」，整个任务挂掉。
        #
        # 24 与 gen/android/app/build.gradle.kts 里的 minSdk 一致：用更高的级别
        # 会让 .so 在低版本系统上加载失败，而那种错误只有真机能发现。
        # **改 minSdk 时这里要跟着改。**
        #
        # armv7 的目标三元组和 wrapper 前缀不一样：Rust 叫
        # armv7-linux-androideabi，NDK 的 wrapper 叫 armv7a-（多一个 a）。
        # 少写那个 a 仍然是「找不到工具」，报错完全看不出差在哪。
        #
        # 变量名用**下划线**形式而不是连字符：带连字符的名字不是合法的 shell
        # 标识符，经 $GITHUB_ENV 传给后续步骤不可靠。cc-rs 两种都认，
        # 已实测只设下划线形式即可生效
        #
        # # 为什么还要单独设 LINKER
        #
        # CC_* 只给 cc-rs 用来编 C（zstd-sys 那种）。链接可执行文件走的是另一
        # 条路：cargo 读 CARGO_TARGET_<TARGET>_LINKER，没设就去找默认的 `cc`。
        # 之前只编 omy-core（一个 lib，不链接）所以没暴露；加上 omy-cli 这个
        # bin 之后就会挂在 `error: linker `cc` not found`——报错完全不提
        # Android，很难联想到是交叉链接器没配。已在本机用 NDK 29 实测确认。
        env:
          API_LEVEL: '24'
        run: |
          BIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$BIN/aarch64-linux-android${API_LEVEL}-clang" || {
            echo "NDK 里没有 aarch64-linux-android${API_LEVEL}-clang，NDK 目录可能不完整"
            ls "$BIN" | head -50
            exit 1
          }
          {
            echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android${API_LEVEL}-clang"
            echo "CC_armv7_linux_androideabi=$BIN/armv7a-linux-androideabi${API_LEVEL}-clang"
            echo "AR_aarch64_linux_android=$BIN/llvm-ar"
            echo "AR_armv7_linux_androideabi=$BIN/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android${API_LEVEL}-clang"
            echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$BIN/armv7a-linux-androideabi${API_LEVEL}-clang"
          } >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: android

      - name: 交叉编译（aarch64）
        # 四个 crate 全编，不是只编 core。
        #
        # 原先只编 core，于是「cli 在 Android 上编不过」这类问题 CI 完全看不见：
        # 实测 omy-cli 曾无条件依赖 trash，而 trash 5.2 的 cfg 排除了 android，
        # 交叉编译在编 trash 自身时就失败——但 CI 编不到 cli，一直显示绿。
        #
        # omy-gui 不在这里：它的 Android 版要走 gradle + tauri 打包，
        # 不是 cargo 单独能编的，放在发布流水线里做。
        run: >
          cargo build -p omy-core -p omy-media -p omy-net -p omy-cli
          --target aarch64-linux-android

      - name: 交叉编译（armv7）
        run: >
          cargo build -p omy-core -p omy-media -p omy-net -p omy-cli
          --target armv7-linux-androideabi

      - name: clippy（Android 目标）
        # 平台专属分支只有在对应目标下才会被 lint。宿主 clippy 检查不到
        # #[cfg(target_os = "android")] 里的代码，所以这一步不可省。
        #
        # --all-targets 包含测试代码：平台相关的缺陷常常先出现在测试里
        run: >
          cargo clippy -p omy-core -p omy-media -p omy-net -p omy-cli
          --all-targets --target aarch64-linux-android -- -D warnings

      - name: 单元测试（在宿主上跑）
        # 交叉编译产物没法在 runner 上执行，所以逻辑测试仍在 x86_64 上跑。
        # 这一步保证「代码逻辑没坏」，上面几步保证「能为 Android 编出来」
        run: cargo test -p omy-core

  # ---- 前端与文档：与平台无关 ----

  frontend:
    name: 前端与文档
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: 构建文档站
        working-directory: site
        # 站点配置里 ignoreDeadLinks: false，所以死链会让这一步失败。
        # 文档站最常见的退化就是改了文件名忘了改链接
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: 上传站点产物
        uses: actions/upload-artifact@v7.0.1
        with:
          name: site
          path: site/dist
          retention-days: 7

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: 检查 i18n 键
        # 缺键的症状是界面上直接显示 remote.readonly 这种原始键名——
        # 构建不报错，测试也不失败，只有肉眼能发现，所以必须单独检查
        run: python spikes/check-i18n-keys.py

      # 前端 UI/逻辑测试（vitest + happy-dom）。mock 掉后端 IPC，专门覆盖
      # 时间线编排与组件模板行为（引用跳转不重载整区、合并保序、双向续翻、
      # 局部 loading、吸顶等）。真实滚动几何仍由 CDP 端到端探针覆盖，这里不碰。
      # pnpm 版本与 windows/android 任务固定同一个（lockfileVersion 9.0）。
      - uses: actions/setup-node@v6.0.0
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 9.15.1

      - name: 前端类型检查与测试
        working-directory: crates/omy-gui/frontend
        # build 脚本本身已含 vue-tsc --noEmit；这里单独跑 typecheck 让类型错误在
        # 更早、日志更短的一步失败，再跑 vitest。
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test

  # ---- 内置 FFmpeg：验证发出去的那份 ----

  ffmpeg-build:
    name: 内置 FFmpeg（Windows）
    runs-on: windows-latest
    # 网络或上游下载端点失去响应时不能再占满 runner 的 6 小时全局上限。
    timeout-minutes: 90
    # 只在改动构建配方时跑。
    #
    # 不挂进日常 PR 是因为它要从源码编 zlib + libwebp + FFmpeg，比其它任务都慢，
    # 而它验证的东西只有配方变了才会变。发布流水线里同样会跑一遍并作为打包门禁，
    # 所以「没跑过就发出去」不会发生。
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.head_commit.message, 'ffmpeg')
    steps:
      - uses: actions/checkout@v7

      # v0.0.4 还没有 Action，故固定到包含 Action 的已审阅提交；version
      # 则显式选择已发布的 CLI，避免 SHA 引用触发 latest API 查询。
      - name: 安装 osdk 并恢复工具缓存
        uses: lejunyang/one-sdk@fa5430bc372854d5998b2e5de3501e1ebec6cd5d
        with:
          version: '0.0.4'
          # Action 只负责安装、缓存与导出环境；若让它在仓库根目录执行默认的
          # 全量 install，会把本任务完全不用的 Android system image 也下载。
          working-directory: ${{ runner.temp }}
          install-tools: false
          install-deps: false
          cache-key: ffmpeg-tools

      - name: 信任 osdk.toml 并安装 FFmpeg 工具链
        shell: pwsh
        run: |
          osdk --yes trust osdk.toml
          # 显式列出配方实际使用的工具。特别是不要退回裸 `osdk install`：
          # 它会下载约 1 GiB 的 Google Android system image，曾静默卡满 6 小时。
          osdk -y install conda:gcc_win-64 conda:nasm conda:cmake conda:ninja conda:m2-base

      - name: 构建
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'dist-ffmpeg'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $gcc = (osdk -q where conda:gcc_win-64).Trim() -split "`r?`n" | Select-Object -First 1
          $posix = ($gcc -replace '\\', '/') -replace '^([A-Za-z]):', '/$1'
          $env:SYSROOT = $posix + '/Library/x86_64-w64-mingw32/sysroot'
          $env:OMY_FF_OUT = ($out -replace '\\', '/') -replace '^([A-Za-z]):', '/$1'
          bash scripts/ffmpeg-build/build-windows.sh
          if ($LASTEXITCODE -ne 0) { throw "构建失败（退出码 $LASTEXITCODE）" }

      - name: 校验产物
        shell: pwsh
        run: |
          $out = ((Join-Path $PWD 'dist-ffmpeg') -replace '\\', '/') -replace '^([A-Za-z]):', '/$1'
          bash scripts/ffmpeg-build/verify.sh $out
          if ($LASTEXITCODE -ne 0) { throw "产物校验未通过（退出码 $LASTEXITCODE）" }

      - name: 安装 Rust
        run: rustup toolchain install stable --profile minimal

      - uses: actions/setup-node@v6.0.0
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 9.15.1

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ffmpeg-build

      - name: 用自建产物跑 omy-media 的测试
        shell: pwsh
        # verify.sh 只能确认「组件在不在」，确认不了 omy 用起来对不对。
        # 本轮踩到的四个缺失组件全都是 configure 接受了参数但没启用，
        # 手工命令行还跑得通，只有项目自己的测试才失败——所以这一步不能省
        run: |
          $env:OMY_FFMPEG = Join-Path $PWD 'dist-ffmpeg\ffmpeg.exe'
          $env:OMY_FFPROBE = Join-Path $PWD 'dist-ffmpeg\ffprobe.exe'
          cargo test -p omy-media

  # ---- 非阻塞核实：MSRV 与未验证平台 ----

  msrv:
    name: MSRV 1.88（未核实）
    runs-on: ubuntu-latest
    # 声明的下限已在本机核实（见文件头），但还没在 CI 上连续绿过，
    # 所以先不设门禁：万一还有别的 1.88 不支持的写法，不该让所有 PR 陪着挂红。
    # 连续绿之后再把这个 continue-on-error 删掉。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: 安装 Rust 1.88
        run: rustup toolchain install 1.88 --profile minimal

      # 同 windows 任务：--all-targets 会编到 omy-gui，它的 build.rs 需要 pnpm。理由见 windows 任务
      - uses: actions/setup-node@v6.0.0
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 9.15.1

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: msrv

      - name: 用 MSRV 编译
        # 只 build 不 test：这一步要回答的是「声明的下限站得住吗」，
        # 测试行为由 stable 任务保证
        run: cargo +1.88 build --workspace --all-targets

  linux:
    name: Linux（未验证）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: 安装系统依赖
        # Tauri v2 需要 WebKitGTK 4.1。omy-gui 依赖它，
        # 缺了会在链接期才报错，而报错信息不会提到缺哪个包
        #
        # ffmpeg 见 windows 任务的说明：不装的话 omy-media 的一批测试只会跳过
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev ffmpeg

      - name: 安装 Rust
        run: rustup toolchain install stable --profile minimal --component clippy

      # 同 windows 任务：omy-gui 的 build.rs 需要 pnpm，理由见那里的说明
      - uses: actions/setup-node@v6.0.0
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 9.15.1

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: linux

      - name: 构建
        run: cargo build --workspace --all-targets

      - name: 测试
        run: cargo test --workspace

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  macos:
    name: macOS（未验证）
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust
        run: rustup toolchain install stable --profile minimal --component clippy

      # 同 windows 任务：omy-gui 的 build.rs 需要 pnpm，理由见那里的说明
      - uses: actions/setup-node@v6.0.0
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 9.15.1

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: macos

      # 见 windows 任务的说明
      - name: 安装 FFmpeg
        run: brew install ffmpeg

      - name: 构建
        run: cargo build --workspace --all-targets

      - name: 测试
        run: cargo test --workspace

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ---- 汇总：让分支保护只需盯一个检查项 ----

  result:
    name: 测试结论
    if: always()
    needs: [windows, android, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: 检查必过任务
        # 只看已验证平台与前端。msrv/linux/macos 不在 needs 里，
        # 它们的红叉是信息，不是门禁。
        #
        # 必须显式判断 result：needs 里任一任务被 skip 或 cancel 时，
        # 这一步默认仍会跑，若不判断就会把「没跑」当成「通过」
        env:
          W: ${{ needs.windows.result }}
          A: ${{ needs.android.result }}
          F: ${{ needs.frontend.result }}
        run: |
          echo "windows  = $W"
          echo "android  = $A"
          echo "frontend = $F"
          if [ "$W" != "success" ] || [ "$A" != "success" ] || [ "$F" != "success" ]; then
            echo "必过任务未全部通过"
            exit 1
          fi
          echo "已验证平台全部通过"
